<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arnold Log Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky file bar + tab rail over a 1440px grid of instrument panels; dark-first like a render monitor */
:root{
  --bg:#111317; --panel:#181b21; --panel2:#1f232b; --line:#2a2f38; --track:#262a32;
  --fg:#e5e7eb; --muted:#8a92a0; --dim:#5f6774;
  --accent:#3ec7c2; --accent-ink:#06201f;
  --ok:#6cc47a; --warn:#f0b23e; --err:#f06464; --info:#7ea6e8;
  --warn-bg:rgba(240,178,62,.10); --err-bg:rgba(240,100,100,.11); --ok-bg:rgba(108,196,122,.10); --info-bg:rgba(126,166,232,.10);
  --c1:#3ec7c2; --c2:#f0a43a; --c3:#8794f7; --c4:#e8678a; --c5:#9ccc5a; --c6:#c08ef0; --c7:#5aa9e6; --c8:#d6be92; --c9:#6b7380;
  --display:'Saira Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#ffffff; --panel2:#f6f7f9; --line:#dde1e7; --track:#e8ebef;
  --fg:#171a1f; --muted:#5b6372; --dim:#8a92a0;
  --accent:#0f8a86; --accent-ink:#ffffff;
  --ok:#2f8a3f; --warn:#a96a00; --err:#c43030; --info:#2f62b8;
  --warn-bg:rgba(220,150,20,.12); --err-bg:rgba(200,50,50,.09); --ok-bg:rgba(47,138,63,.09); --info-bg:rgba(47,98,184,.08);
  --c1:#1aa39e; --c2:#e08a14; --c3:#5d6ae6; --c4:#d6456e; --c5:#6fa830; --c6:#9a5fd8; --c7:#2c86cf; --c8:#b39a68; --c9:#9aa1ad;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#ffffff; --panel2:#f6f7f9; --line:#dde1e7; --track:#e8ebef;
  --fg:#171a1f; --muted:#5b6372; --dim:#8a92a0;
  --accent:#0f8a86; --accent-ink:#ffffff;
  --ok:#2f8a3f; --warn:#a96a00; --err:#c43030; --info:#2f62b8;
  --warn-bg:rgba(220,150,20,.12); --err-bg:rgba(200,50,50,.09); --ok-bg:rgba(47,138,63,.09); --info-bg:rgba(47,98,184,.08);
  --c1:#1aa39e; --c2:#e08a14; --c3:#5d6ae6; --c4:#d6456e; --c5:#6fa830; --c6:#9a5fd8; --c7:#2c86cf; --c8:#b39a68; --c9:#9aa1ad;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px}
@media (max-width:600px){.wrap{padding-inline:16px}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;line-height:1}
.brand h1 b{color:var(--accent);font-weight:700}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.files{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 10px}
.chipf{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px 4px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;max-width:100%}
.chipf .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.chipf small{color:var(--muted)}
.chipf.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chipf .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.chipf .x:hover{color:var(--err)}
.sample-tag{font-family:var(--body);font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:1px 5px}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:10px;padding:0 5px;border-radius:8px;background:var(--panel2);color:var(--muted)}
.tab .cnt.w{background:var(--warn-bg);color:var(--warn)}
.tab .cnt.e{background:var(--err-bg);color:var(--err)}

main{padding-block:20px 60px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1100px){.s4,.s3{grid-column:span 6}.s8,.s7,.s5{grid-column:span 12}}
@media (max-width:760px){.s6,.s4,.s3{grid-column:span 12}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-wrap:balance}
.panel h2 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 8px;font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header strip */
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-bottom:16px}
.strip .fn{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:.01em;word-break:break-all}
.strip .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.strip .meta b{color:var(--fg);font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px}
.status.ok{background:var(--ok-bg);color:var(--ok)}.status.bad{background:var(--err-bg);color:var(--err)}.status.mid{background:var(--warn-bg);color:var(--warn)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);padding:14px 16px;min-width:0}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.warn .v{color:var(--warn)}.kpi.err .v{color:var(--err)}

/* insights */
.ins{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:6px;background:var(--panel2)}
.sev{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border-radius:3px;padding:2px 0;text-align:center}
.sev.critical{background:var(--err-bg);color:var(--err)}.sev.warning{background:var(--warn-bg);color:var(--warn)}.sev.info{background:var(--info-bg);color:var(--info)}.sev.good{background:var(--ok-bg);color:var(--ok)}
.ins .t{font-weight:600}
.ins .d{color:var(--muted);font-size:13px;margin-top:2px}
.ins .d code{font-family:var(--mono);font-size:12px;color:var(--fg)}

/* donut + legend */
.dl{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:420px){.dl{grid-template-columns:1fr}.dl svg{max-width:180px;margin:0 auto}}
.donut{width:100%;height:auto;max-width:100%}
.donut .dc{font-family:var(--display);font-weight:600;font-size:22px;fill:var(--fg)}
.donut .ds{font-family:var(--body);font-size:10px;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 48px;gap:8px;align-items:center;font-size:12.5px}
.legend i{width:10px;height:10px;border-radius:2px}
.legend .ll{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lv,.legend .lp{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.legend .lp{color:var(--muted)}

/* tree */
.tree{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,26%) 92px 56px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--track);font-size:13px}
.tr:last-child{border-bottom:0}
.tr .tl{padding-left:calc(var(--d,0) * 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.root .tl{font-weight:600}
.tr.rem .tl{color:var(--muted);font-style:italic}
.tr .tb{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.tr .tb b{display:block;height:100%;background:var(--accent);border-radius:3px}
.tr.d1 .tb b{background:var(--c3)}.tr.d2 .tb b{background:var(--c8)}.tr.d3 .tb b{background:var(--c9)}
.tr .tv,.tr .tp{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tr .tp{color:var(--muted)}
.tr .tl .ut{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;font-weight:400}
@media (max-width:520px){.tr{grid-template-columns:minmax(0,1fr) 80px 48px}.tr .tb{display:none}}

/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.br{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:12.5px}
.br .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .bl em{font-style:normal;color:var(--muted);font-size:11.5px}
.br .bt{height:14px;background:var(--track);border-radius:3px;overflow:hidden}
.br .bt b{display:block;height:100%;border-radius:3px}
.br .bv{font-family:var(--mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl th.n,.tbl td.n{text-align:right}
.tbl th[data-k]{cursor:pointer;user-select:none}
.tbl th[data-k]:hover{color:var(--fg)}
.tbl th .ar{color:var(--accent)}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--track);vertical-align:top}
.tbl td.n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.p{font-family:var(--mono);font-size:11.5px;word-break:break-all;min-width:220px}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.tbl tbody tr:hover td{background:var(--panel2)}
.flag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;border-radius:3px;padding:1px 5px;margin:1px 4px 1px 0;background:var(--warn-bg);color:var(--warn);font-family:var(--body)}
.flag.e{background:var(--err-bg);color:var(--err)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.heat{border-radius:3px;padding:2px 6px;display:inline-block;min-width:52px}

/* kv */
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:5px 18px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word;min-width:0}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chart .grid line{stroke:var(--track)}
.chart .mk line{stroke:var(--dim);stroke-dasharray:3 3}
.chart .mk text{fill:var(--dim)}
.phase{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--track);gap:1px}
.phase span{display:block;height:100%;min-width:2px}
.plg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px}
.plg span{display:inline-flex;gap:6px;align-items:center}
.plg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.plg b{font-family:var(--mono);font-weight:500;font-size:12px}

/* warnings */
.wl{display:flex;flex-direction:column;gap:6px}
.wi{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 10px;border-radius:6px;background:var(--panel2);font-size:13px}
.wi .wc{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;text-align:right;color:var(--warn)}
.wi.e .wc{color:var(--err)}
.wi .wm{font-family:var(--mono);font-size:12px;word-break:break-word}
.wi .wt{font-size:11px;color:var(--muted);margin-top:3px}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;white-space:nowrap}
.lnk:hover{text-decoration:underline}

/* log viewer */
.lf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.lf input[type=search]{flex:1 1 240px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.lf select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.lf label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.logv{font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-height:70vh;overflow:auto}
.lr{display:grid;grid-template-columns:52px 64px 74px minmax(0,1fr);gap:10px;padding:0 10px;white-space:pre-wrap;word-break:break-word}
.lr:hover{background:var(--panel2)}
.lr .ln{color:var(--dim);text-align:right;user-select:none}
.lr .lt,.lr .lm{color:var(--muted);font-variant-numeric:tabular-nums}
.lr.w{background:var(--warn-bg)}.lr.w .lx{color:var(--warn)}
.lr.e{background:var(--err-bg)}.lr.e .lx{color:var(--err)}
.lr .tag{color:var(--accent)}
.lr mark{background:var(--warn);color:#111;border-radius:2px}
@media (max-width:600px){.lr{grid-template-columns:40px minmax(0,1fr)}.lr .lt,.lr .lm{display:none}}
pre.raw{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:420px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin:10px 0 6px}

/* drop + paste */
.drop{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;border:3px dashed var(--accent)}
.drop div{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent)}
.paste{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:14px;margin-bottom:16px}
.paste textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}
.paste .row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;flex-wrap:wrap}
.paste .pl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.paste .keep{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-right:auto}
.pmsg{font-size:12.5px}
.pmsg.err{color:var(--err)}.pmsg.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint code{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--panel2);padding:1px 5px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Arnold <b>Log</b> Inspector</h1><span>render log · stats · profile</span></div>
    <button class="btn" id="pasteBtn" type="button" title="Or press Ctrl+V anywhere">Paste log</button>
    <label class="btn primary" for="fileIn">Open logs…</label>
    <input id="fileIn" type="file" multiple accept=".log,.txt,.json,text/plain,application/json" hidden>
  </div>
  <div class="wrap files" id="files"></div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main class="wrap">
  <div id="pastePanel" class="paste" hidden>
    <label for="pasteTa" class="pl">Paste an Arnold log (kick, HtoA, MtoA, Deadline output…) or a stats / profile .json</label>
    <textarea id="pasteTa" spellcheck="false" placeholder="00:00:00   112MB         | log started …"></textarea>
    <div class="row">
      <label class="keep"><input type="checkbox" id="pasteKeep"> Keep the current logs too (for Compare)</label>
      <span id="pasteMsg" class="pmsg" role="status"></span>
      <button class="btn" id="pasteClear" type="button">Clear text</button>
      <button class="btn" id="pasteCancel" type="button">Close</button>
      <button class="btn primary" id="pasteGo" type="button">Analyze log</button>
    </div>
  </div>
  <div id="view"></div>
</main>
<div class="drop" id="drop" hidden><div>Drop Arnold logs to analyze</div></div>

<script>
/* ============================== helpers ============================== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtInt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('en-US');
const fmtNum=(n,d=2)=>n==null||isNaN(n)?'—':(+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct=(n,d=1)=>n==null||isNaN(n)?'—':(+n).toFixed(d)+'%';
function fmtDur(s){
  if(s==null||isNaN(s)) return '—';
  if(s<60) return s.toFixed(s<10?2:1)+'s';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return h?`${h}h ${String(m).padStart(2,'0')}m ${String(Math.round(r)).padStart(2,'0')}s`:`${m}m ${r.toFixed(1).padStart(4,'0')}s`;
}

/* ============================== log parser ============================== */
const LINE_RE=/(?:^|[^\d:])(\d+):(\d\d):(\d\d)(?:\.\d+)?\s+(\d+(?:\.\d+)?)\s*(MB|GB)\s+(?:(WARNING|ERROR|INFO|DEBUG|VERBOSE)\s+)?\|\s?(.*)$/;

function emptyModel(name){
  return {name,kind:'log',lines:[],info:{libs:[],gpus:[],pluginPaths:[],pluginNodes:[],aovs:[],outputs:[],samples:[],license:[],subdiv:[],accel:[],written:[]},
    progress:[],memSeries:[],warnings:[],errors:[],warnSummary:[],time:{},selfCat:[],selfNode:[],memTrees:[],rays:null,shaders:null,
    tables:[],rawSections:[],tex:null,phases:[],insights:[]};

function parseLog(text,name){
  const L=emptyModel(name), I=L.info;
  const raw=text.replace(/\r\n?/g,'\n').split('\n');
  if(raw.length && raw[raw.length-1]==='') raw.pop();

    const s=o.msg.trim(); let m;

      parts.forEach(p=>{ const q=p.match(/^([a-z][\w]*?)-(\d[\w.]*)$/i); if(q) I.libs.push([q[1],q[2]]); });
    }
    else if((m=s.match(/^running on ([^,]+),\s*pid=(\d+)/))){ I.host=m[1]; I.pid=m[2]; }
    else if((m=s.match(/^(\d+)\s*x\s*(.+?)\s*\((\d+) cores?,\s*(\d+) logical\)\s*with\s*(\d+)\s*MB/i))){ I.sockets=+m[1]; I.cpu=m[2]; I.cores=+m[3]; I.logical=+m[4]; I.ramMB=+m[5]; }
    else if((m=s.match(/^GPU (\d+):\s*(.+?)\s*@\s*(\d+)\s*MHz.*?with\s*(\d+)\s*MB/))){ I.gpus.push({id:m[1],name:m[2],mhz:m[3],mb:+m[4]}); }
    else if((m=s.match(/NVIDIA driver version ([\d.]+)/))) I.driver=m[1];
    else if(o.n<40 && !I.os && /(kernel|Windows \d|Windows Server|macOS|Darwin|Rocky Linux|CentOS|Ubuntu|Red Hat|AlmaLinux|Debian)/i.test(s) && !/^Arnold /.test(s)) I.os=s;
    else if((m=s.match(/loading plugins from (.+?)\s*\.\.\.?$/))){ I.pluginPaths.push(m[1]); }
    else if((m=s.match(/^loaded (\d+) plugins? from (\d+) lib\(?s?\)?(?: in ([\d:.]+))?/))){ I.plugins=+m[1]; I.pluginLibs=+m[2]; if(m[3]) I.pluginTime=parseDur(m[3]); }
    else if((m=s.match(/^(\S+\.(?:so|dll|dylib)):\s*(\S+) uses Arnold/))){ I.pluginNodes.push([m[1],m[2]]); }
    if((m=s.match(/\b(HtoA|MtoA|C4DtoA|KtoA|MAXtoA|SItoA|UsdArnold|arnold-usd)\s+v?([\d.]+)\s*(.*)$/i)) && !I.dcc){ I.dcc=`${m[1]} ${m[2]}`; I.host_app=m[3]; }
    if((m=s.match(/OCIO config (?:file )?(.+)$/i))) I.ocio=m[1];
    if((m=s.match(/rendering color space is "([^"]+)"/))) I.colorspace=m[1];
    if((m=s.match(/reading scene from (.+)$/)) || (m=s.match(/\[ass\] loading (.+?)(?: \.\.\.)?$/))) I.scene=I.scene||m[1];
    if((m=s.match(/^rendering image at (\d+) x (\d+)(?:,\s*(\d+) AA samples?)?/))){ I.w=+m[1]; I.h=+m[2]; if(m[3]) I.aa=+m[3]; }

    if((m=s.match(/adaptive sampling (on|off|enabled|disabled)(?:,\s*threshold ([\d.]+))?/i))){ I.adaptive=/on|enabled/i.test(m[1]); if(m[2]) I.adaptiveThr=+m[2]; }

    if((m=s.match(/render device:\s*(\w+)/i))) I.device=m[1];
    if((m=s.match(/registered driver: "([^"]+)" \((\w+)\)\s*->\s*(.+)$/))) I.outputs.push({name:m[1],type:m[2],path:m[3]});
    if((m=s.match(/\[aov\]\s+\*\s+"([^"]+)" of type (\w+)(?: filtered by "([^"]+)")?/))) I.aovs.push({name:m[1],type:m[2],filter:m[3]||'',driver:I.outputs.length?I.outputs[I.outputs.length-1].name:''});

    if((m=s.match(/^node initialization done in ([\d:.]+)/))) I.initTime=parseDur(m[1]);

    if((m=s.match(/^node update done in ([\d:.]+)/))) I.updTime=parseDur(m[1]);

    if((m=s.match(/scene bounds: \(([^)]+)\)\s*->\s*\(([^)]+)\)/))) I.bounds=[m[1].trim().split(/\s+/).map(Number),m[2].trim().split(/\s+/).map(Number)];
    if((m=s.match(/\[subdiv\]\s*(.+)$/))) I.subdiv.push(m[1]);
    if((m=s.match(/\[accel\]\s*(.+)$/))) I.accel.push(m[1]);
    if((m=s.match(/\[(clm|rlm|license|licensing)\]\s*(.+)$/i))) I.license.push(m[2]);
    if((m=s.match(/texture cache max memory (\d+)\s*MB/))) I.texMax=+m[1];

function parseTree(lines,kind){

    while(stack.length && stack[stack.length-1].ind>=ind) stack.pop();
    if(stack.length) stack[stack.length-1].children.push(node); else roots.push(node);

<script>
/* ============================== UI ============================== */
const state={logs:[],active:0,tab:'overview',lf:{q:'',lvl:'all',tag:'all',stats:true}};
try{ const t=localStorage.getItem('ali.tab'); if(t) state.tab=t; }catch(e){}
const TABS=[['overview','Overview'],['time','Time'],['memory','Memory'],['rays','Rays & Shading'],['textures','Textures'],['geometry','Geometry'],['warnings','Warnings'],['system','System'],['log','Log'],['sequence','Compare']];

function cur(){ return state.logs[state.active]; }
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),4200); }

/* ---------- chart primitives ---------- */
function collapse(items,max=7){ items=items.filter(i=>i.v>0).sort((a,b)=>b.v-a.v); if(items.length<=max) return items; const keep=items.slice(0,max-1); const rest=items.slice(max-1); keep.push({label:`Other (${rest.length})`,v:sum(rest,r=>r.v),fmt:null,other:true}); return keep; }
function donutBlock(items,{center,sub,fmt,max=7}={}){
  items=collapse(items,max); const tot=sum(items,i=>i.v)||1;
  items.forEach((it,i)=>{ it.c=it.other?OTHER:COL[i%COL.length]; it.f=fmt(it.v); });
  const R=68,W=22,C=2*Math.PI*R; let acc=0;
  const segs=items.map(it=>{ const len=it.v/tot*C; const gap=items.length>1?Math.min(1.6,len*.4):0; const s=`<circle r="${R}" cx="90" cy="90" fill="none" style="stroke:${it.c}" stroke-width="${W}" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${esc(it.label)}: ${esc(it.f)} (${(it.v/tot*100).toFixed(1)}%)</title></circle>`; acc+=len; return s; }).join('');
  const svg=`<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${esc(sub)}"><circle r="${R}" cx="90" cy="90" fill="none" style="stroke:var(--track)" stroke-width="${W}"/>${segs}<text x="90" y="92" text-anchor="middle" class="dc">${esc(center)}</text><text x="90" y="110" text-anchor="middle" class="ds">${esc(sub)}</text></svg>`;
  const lg=`<ul class="legend">${items.map(it=>`<li><i style="background:${it.c}"></i><span class="ll" title="${esc(it.label)}">${esc(it.label)}</span><span class="lv">${esc(it.f)}</span><span class="lp">${(it.v/tot*100).toFixed(1)}%</span></li>`).join('')}</ul>`;
  return `<div class="dl">${svg}${lg}</div>`;
}
function niceStep(range,n=4){ const raw=range/n; const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function lineChart(series,o={}){
  const W=720,H=o.h||220,ml=o.ml||58,mr=18,mt=16,mb=28;
  const pts=series.flatMap(s=>s.pts); if(pts.length<2) return '<div class="empty">Not enough timestamped lines to draw this chart.</div>';
  let xmin=o.xMin??amin(pts,p=>p[0]),xmax=amax(pts,p=>p[0]); if(xmax===xmin) xmax=xmin+1;
  const ymin=o.yMin??0; let ymax=amax(pts,p=>p[1]);
  const ys=niceStep(ymax-ymin); ymax=Math.ceil(ymax/ys)*ys||ys;
  const xs=niceStep(xmax-xmin,6);
  const X=x=>ml+(x-xmin)/(xmax-xmin)*(W-ml-mr), Y=y=>mt+(1-(y-ymin)/(ymax-ymin))*(H-mt-mb);
  let g='<g class="grid">';
  for(let y=ymin;y<=ymax+1e-9;y+=ys){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${ml-8}" y="${Y(y)+3.5}" text-anchor="end">${esc((o.yFmt||String)(y))}</text>`; }
  for(let x=Math.ceil(xmin/xs)*xs;x<=xmax+1e-9;x+=xs){ g+=`<text x="${X(x)}" y="${H-8}" text-anchor="middle">${esc((o.xFmt||String)(x))}</text>`; }
  g+='</g>';
  let mk='';
  (o.marks||[]).forEach(m=>{ if(m.x<xmin||m.x>xmax) return; mk+=`<g class="mk"><line x1="${X(m.x)}" x2="${X(m.x)}" y1="${mt}" y2="${H-mb}"/><text x="${X(m.x)+4}" y="${mt+10}">${esc(m.label)}</text></g>`; });
  const paths=series.map(s=>{
    const p=s.pts.map(q=>`${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`);
    const line=`M${p.join('L')}`; const last=s.pts[s.pts.length-1];
    const area=s.area?`<path d="${line}L${X(last[0]).toFixed(1)},${Y(ymin)}L${X(s.pts[0][0]).toFixed(1)},${Y(ymin)}Z" style="fill:${s.color};opacity:.14"/>`:'';
    return `${area}<path d="${line}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" style="fill:${s.color}"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'chart')}">${g}${mk}${paths}</svg>`;
}
function bars(items,{fmt,max,color='var(--c1)',sub}={}){
  if(!items.length) return '<div class="empty">No data in this log.</div>';
  const M=max||amax(items,i=>i.v)||1;
  return `<div class="bars">${items.map((it,i)=>`<div class="br"><span class="bl" title="${esc(it.label)}">${esc(it.label)}${it.sub?` <em>${esc(it.sub)}</em>`:''}</span><span class="bt"><b style="width:${(it.v/M*100).toFixed(2)}%;background:${it.c||color}"></b></span><span class="bv">${esc(fmt(it.v,it))}</span></div>`).join('')}</div>`;
}
function treeView(root,fmt,{showUtil}={}){
  if(!root) return '<div class="empty">This section was not found in the log. Render with stats enabled (verbosity ≥ 2 / log level "info" with stats).</div>';
  const tot=root.v||1, rows=[];
  const walk=(n,d,parent)=>{
    rows.push(`<div class="tr ${d===0?'root':''} d${Math.min(d,3)}" style="--d:${d}"><span class="tl" title="${esc(n.label)}">${esc(n.label)}${showUtil&&n.util!=null?`<span class="ut">${fmtPct(n.util)} util.</span>`:''}</span><span class="tb"><b style="width:${(n.v/tot*100).toFixed(2)}%"></b></span><span class="tv">${fmt(n.v)}</span><span class="tp">${parent?fmtPct(n.v/(parent.v||1)*100):'100%'}</span></div>`);
    n.children.forEach(c=>walk(c,d+1,n));
    if(n.children.length){ const rem=n.v-sum(n.children,c=>c.v); if(rem>n.v*0.01) rows.push(`<div class="tr rem d${Math.min(d+1,3)}" style="--d:${d+1}"><span class="tl">not itemized</span><span class="tb"><b style="width:${(rem/tot*100).toFixed(2)}%"></b></span><span class="tv">${fmt(rem)}</span><span class="tp">${fmtPct(rem/(n.v||1)*100)}</span></div>`); }
  };
  walk(root,0,null);
  return `<div class="tree">${rows.join('')}</div>`;
}
let TB={},tbN=0;
function stable(cols,rows,{sort,dir=-1,total}={}){ const id='tb'+(++tbN); TB[id]={cols,rows,sort,dir,total}; return `<div class="tw" id="${id}">${renderTable(id)}</div>`; }
function renderTable(id){
  const t=TB[id]; let rows=[...t.rows];
  if(t.sort){ const c=t.cols.find(c=>c.k===t.sort); const gv=c.sv||(r=>r[c.k]); rows.sort((a,b)=>{ const x=gv(a),y=gv(b); return (typeof x==='string'?x.localeCompare(y):(x??-Infinity)-(y??-Infinity))*t.dir; }); }
  const th=t.cols.map(c=>`<th class="${c.n?'n':''}" ${c.nosort?'':`data-t="${id}" data-k="${c.k}"`} scope="col">${esc(c.label)}${t.sort===c.k?` <span class="ar">${t.dir<0?'↓':'↑'}</span>`:''}</th>`).join('');
  const td=r=>t.cols.map(c=>`<td class="${c.n?'n':''} ${c.cls||''}">${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join('');
  return `<table class="tbl"><thead><tr>${th}</tr></thead><tbody>${rows.map(r=>`<tr>${td(r)}</tr>`).join('')}${t.total?`<tr class="tot">${td(t.total)}</tr>`:''}</tbody></table>`;
}
document.addEventListener('click',e=>{ const th=e.target.closest('th[data-t]'); if(!th) return; const t=TB[th.dataset.t]; if(!t) return; const k=th.dataset.k; if(t.sort===k) t.dir*=-1; else { t.sort=k; t.dir=-1; } document.getElementById(th.dataset.t).innerHTML=renderTable(th.dataset.t); });
const kv=pairs=>`<dl class="kv">${pairs.filter(p=>p[1]!=null&&p[1]!==''&&!(Array.isArray(p[1])&&!p[1].length)).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')||'<dt>—</dt><dd class="muted">Not in this log</dd>'}</dl>`;
const panel=(cls,title,body,sub)=>`<section class="panel ${cls}"><h2>${title}${sub?` <small>${sub}</small>`:''}</h2>${body}</section>`;

/* ---------- views ---------- */
function headerStrip(L){
  const I=L.info; let st;
  if(L.errors.length||I.crash) st=`<span class="status bad">● ${L.errors.length?L.errors.length+' error'+(L.errors.length>1?'s':''):'crash'}</span>`;
  else if(L.kind!=='log') st=`<span class="status mid">● ${L.kind==='profile'?'profile JSON':'stats JSON'}</span>`;
  else if(I.renderDone||L.time['frame time']) st=`<span class="status ok">● render complete</span>`;
  else st=`<span class="status mid">● incomplete</span>`;
  return `<div class="strip"><div class="fn">${esc(L.name)}</div>${st}<div class="meta">${I.host?`<span>host <b>${esc(I.host)}</b></span>`:''}${I.version?`<span>Arnold <b>${esc(I.version)}</b></span>`:''}${I.dcc?`<span><b>${esc(I.dcc)}</b> ${esc(I.host_app||'')}</span>`:''}${I.started?`<span>${esc(I.started)}</span>`:''}</div></div>`;
}
function vOverview(L){
  const I=L.info, T=L.rays?.total;
  const res=I.w?`${I.w}×${I.h}`:'—';
  const issues=`${L.errors.length} / ${L.warnings.length}`;
  const k=[
    {k:L.frameTime!=null?'Frame time':'Log wall time',v:fmtDur(L.frameTime??L.wallTime),s:L.frameTime==null?(L.wallTime!=null?'no frame stats in this log':''):I.renderDone?`pixels ${fmtDur(I.renderDone)}`:(L.sceneTime!=null?`scene ${fmtDur(L.sceneTime)}`:'')},
    {k:'Peak memory',v:fmtMB(L.peakMB),s:I.ramMB&&L.peakMB?`${fmtPct(L.peakMB/I.ramMB*100)} of ${fmtMB(I.ramMB)} RAM`:''},
    {k:'Resolution',v:res,s:I.aa?`AA ${I.aa}${I.aaMax?'–'+I.aaMax:''}${I.w?' · '+(I.w*I.h/1e6).toFixed(2)+' MP':''}`:''},
    {k:'Rays / pixel',v:T?.perPixel!=null?fmtInt(T.perPixel):(L.progress.length?fmtInt(L.progress[L.progress.length-1].rpp):'—'),s:T?.total?`${(T.total/1e9).toFixed(2)} B rays total`:''},
    {k:'Utilization',v:L.util!=null?fmtPct(L.util):'—',s:I.threads?`${I.threads} threads · ${I.device||'CPU'}`:''},
    {k:'Errors / warnings',v:issues,s:`${L.uniqueWarnings.length} unique warning types`,cls:L.errors.length?'err':(L.warnings.length?'warn':'')},
  ];
  let h=headerStrip(L)+`<div class="kpis">${k.map(x=>`<div class="kpi ${x.cls||''}"><div class="k">${x.k}</div><div class="v" title="${esc(x.v)}">${esc(x.v)}</div><div class="s">${esc(x.s||' ')}</div></div>`).join('')}</div>`;
  h+='<div class="grid" style="margin-top:16px">';
  h+=panel('s7','Findings',L.insights.length?`<ul class="ins">${L.insights.map(i=>`<li><span class="sev ${i.sev}">${i.sev}</span><div><div class="t">${esc(i.t)}</div><div class="d">${i.d}</div></div></li>`).join('')}</ul>`:'<div class="empty">Nothing stands out in this log.</div>',`${L.insights.length} checks triggered`);
  h+=panel('s5','Wall-clock phases',phaseBlock(L)+`<h3>Render settings</h3>`+kv([['Camera AA',I.aa!=null?`${I.aa}${I.aaMax?` (max ${I.aaMax})`:''}${I.clamp?` · clamp ${I.clamp}`:''}`:null],['Adaptive',I.adaptive!=null?(I.adaptive?`on · threshold ${I.adaptiveThr??'—'}`:'off'):null],...I.samples.map(s=>[s.type,`${s.samples} samples${s.depth!=null?` · depth ${s.depth}`:''}`]),['Depth',I.totalDepth!=null?`total ${I.totalDepth}${I.transpDepth!=null?` · transparency ${I.transpDepth}`:''}`:null],['Color space',I.colorspace?esc(I.colorspace):null]]),'from log timestamps');
  const ft=L.time['frame time']||L.time['render time'];
  h+=panel('s4','Frame time',ft?donutBlock(ft.children.map(c=>({label:c.label,v:c.v})),{center:fmtDur(ft.v),sub:'frame',fmt:fmtDur}):(L.selfCat.length?donutBlock(L.selfCat.map(c=>({label:c.label,v:c.v})),{center:fmtDur(sum(L.selfCat,c=>c.v)),sub:'self time',fmt:fmtDur}):'<div class="empty">No timing stats in this log.</div>'));
  h+=panel('s4','Peak memory',L.memTree?donutBlock(L.memTree.children.map(c=>({label:c.label,v:c.v})),{center:fmtMB(L.memTree.v),sub:'peak',fmt:fmtMB}):'<div class="empty">No memory stats in this log.</div>');
  h+=panel('s4','Rays by type',L.rays?donutBlock(L.rays.rows.map(r=>({label:r.name,v:r.total})),{center:T?.perPixel!=null?fmtInt(T.perPixel):'',sub:'rays / px',fmt:v=>(v/1e6).toFixed(1)+'M'}):'<div class="empty">No ray stats in this log.</div>');
  h+=panel('s6','Render progress',L.progress.length>1?lineChart([{pts:L.progress.map(p=>[p.t,p.pct]),color:'var(--c1)',area:true}],{yFmt:v=>v+'%',xFmt:fmtClock,label:'percent done over time',xMin:L.progress[0].t}):'<div class="empty">No progress lines found.</div>',L.progress.length>1?`${fmtDur(L.progress[L.progress.length-1].t-L.progress[0].t)} from first to last bucket`:'');
  h+=panel('s6','Memory over time',memChart(L),'resident memory column of every log line');
  return h+'</div>';
}
function phaseBlock(L){
  if(!L.phases.length) return '<div class="empty">Log has no timestamps.</div>';
  const tot=sum(L.phases,p=>p.d)||1;
  return `<div class="phase" role="img" aria-label="phases">${L.phases.map((p,i)=>`<span style="flex:${Math.max(p.d,tot*0.004)};background:${COL[i%COL.length]}" title="${esc(p.label)}: ${fmtDur(p.d)}"></span>`).join('')}</div><div class="plg">${L.phases.map((p,i)=>`<span><i style="background:${COL[i%COL.length]}"></i>${esc(p.label)} <b>${fmtDur(p.d)}</b></span>`).join('')}</div>`;
}
function memChart(L,h){

}
function vTime(L){

  const d=(v,b)=>{ if(v==null||b==null||!b) return ''; const p=(v-b)/b*100; if(Math.abs(p)<0.5) return ''; return ` <span style="color:${p>0?'var(--err)':'var(--ok)'};font-size:11px">${p>0?'+':''}${p.toFixed(1)}%</span>`; };
  let h='<div class="grid">';
  h+=panel('s12','Logs side by side',stable([{k:'name',label:'Log',cls:'p'},{k:'host',label:'Host'},{k:'ft',label:'Frame time',n:1,f:(v,r)=>fmtDur(v)+(r.i?d(v,rows[0].ft):'')},{k:'peak',label:'Peak memory',n:1,f:(v,r)=>fmtMB(v)+(r.i?d(v,rows[0].peak):'')},{k:'rpp',label:'Rays / px',n:1,f:(v,r)=>fmtInt(v)+(r.i?d(v,rows[0].rpp):'')},{k:'util',label:'Util.',n:1,f:v=>fmtPct(v)},{k:'tex',label:'Tex read',n:1,f:v=>fmtMB(v)},{k:'warn',label:'Warn',n:1},{k:'err',label:'Err',n:1}],rows),`deltas are against ${esc(base.name)}`);
  const short=n=>n.replace(/\.(log|txt|json)$/,'').slice(-28);
  h+=panel('s6','Frame time',bars(rows.map((r,i)=>({label:short(r.name),v:r.ft||0,c:COL[0]})),{fmt:v=>fmtDur(v)}));
  h+=panel('s6','Peak memory',bars(rows.map(r=>({label:short(r.name),v:r.peak||0,c:COL[1]})),{fmt:v=>fmtMB(v)}));
  if(rows.length>=3) h+=panel('s12','Across the range',lineChart([{pts:rows.map((r,i)=>[i+1,r.ft||0]),color:'var(--c1)',area:true}],{yFmt:v=>fmtDur(v),xFmt:v=>Number.isInteger(v)?'#'+v:'',xMin:1,label:'frame time per log',ml:72}),'frame time per log in load order');
  return h+'</div>';
}

/* ---------- shell ---------- */
function renderFiles(){
  const el=document.getElementById('files');
  el.innerHTML=state.logs.map((L,i)=>`<span class="chipf ${i===state.active?'on':''}" data-i="${i}" role="button" tabindex="0"><span class="nm" title="${esc(L.name)}">${esc(L.name)}</span>${L.sample?'<span class="sample-tag">sample</span>':''}<small>${fmtDur(L.frameTime)}</small><button class="x" type="button" data-x="${i}" aria-label="Remove ${esc(L.name)}">×</button></span>`).join('')+
    (state.logs.length&&state.logs[0].sample?`<span class="hint" style="margin:0">This is an example log. Press <code>Ctrl+V</code> anywhere to paste your own, or open / drop <code>.log</code> and <code>.json</code> files. Nothing leaves your browser.</span>`:'');
}
function renderTabs(){
  const L=cur(); const cnt={warnings:L?(L.errors.length?`<span class="cnt e">${L.errors.length}</span>`:L.warnings.length?`<span class="cnt w">${L.warnings.length}</span>`:''):'',sequence:state.logs.length>1?`<span class="cnt">${state.logs.length}</span>`:'',log:L?`<span class="cnt">${fmtInt(L.lines.length)}</span>`:''};
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" data-tab="${k}" type="button">${l}${cnt[k]||''}</button>`).join('');
}
function render(){
  TB={}; tbN=0;
  renderFiles(); renderTabs();
  const L=cur(), v=document.getElementById('view');
  if(!L){ v.innerHTML=`<section class="panel"><h2>No log loaded</h2><p class="muted">Open or drop an Arnold render log to begin.</p></section>`; return; }
  const fn={overview:vOverview,time:vTime,memory:vMemory,rays:vRays,textures:vTextures,geometry:vGeometry,warnings:vWarnings,system:vSystem,log:vLog,sequence:vSequence}[state.tab]||vOverview;
  try{ v.innerHTML=fn(L); }catch(e){ console.error(e); v.innerHTML=`<section class="panel"><h2>Couldn't draw this view</h2><p class="muted">${esc(e.message)}. The other tabs may still work; the raw lines are in the Log tab.</p></section>`; }
  if(state.tab==='log') bindLog();
}
function bindLog(){
  fillLog();
  let tmr; document.getElementById('lq').addEventListener('input',e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ state.lf.q=e.target.value; fillLog(); },160); });
  document.getElementById('llvl').addEventListener('change',e=>{ state.lf.lvl=e.target.value; fillLog(); });
  document.getElementById('ltag').addEventListener('change',e=>{ state.lf.tag=e.target.value; fillLog(); });
  document.getElementById('lstat').addEventListener('change',e=>{ state.lf.stats=e.target.checked; fillLog(); });
}
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; state.tab=b.dataset.tab; try{ localStorage.setItem('ali.tab',state.tab); }catch(x){} render(); window.scrollTo({top:0}); });
document.getElementById('files').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]'); if(x){ e.stopPropagation(); state.logs.splice(+x.dataset.x,1); state.active=Math.min(state.active,state.logs.length-1); render(); return; }
  const c=e.target.closest('[data-i]'); if(c){ state.active=+c.dataset.i; render(); }
});
document.getElementById('files').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset.i!=null){ e.preventDefault(); state.active=+e.target.dataset.i; render(); } });
document.getElementById('view').addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]'); if(!j) return;
  state.tab='log'; state.lf={q:'',lvl:'all',tag:'all',stats:true}; render();
  const row=document.getElementById('ln'+j.dataset.jump); if(row){ row.scrollIntoView({block:'center'}); row.style.outline='2px solid var(--accent)'; }
});
let pasteN=0;
// mode: 'replace' swaps out every loaded log, 'add' keeps them (Compare)
function addTexts(items,mode='add'){
  const loaded=[],errs=[];
  for(const {name,text} of items){
    try{ loaded.push(parseAny(text,name)); }
    catch(e){ console.error(e); errs.push(`${name}: ${e.message}`); }
  }
  if(loaded.length){
    if(mode==='replace') state.logs=[];
    state.logs=state.logs.filter(x=>!x.sample);
    for(const L of loaded){ const j=state.logs.findIndex(x=>x.name===L.name); if(j>=0) state.logs[j]=L; else state.logs.push(L); }
    state.logs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    state.active=state.logs.indexOf(loaded[loaded.length-1]);
    state.lf={q:'',lvl:'all',tag:'all',stats:true};
    if(state.tab==='sequence'&&state.logs.length<2) state.tab='overview';
    render(); window.scrollTo({top:0});
  }
  if(errs.length) toast(`Couldn't read ${errs.join('; ')}`);
  else if(loaded.length) toast(loaded.length>1?`Loaded ${loaded.length} logs.`:`Loaded ${loaded[0].name}${loaded[0].unrecognized?' (no Arnold lines recognised)':''}.`);
  return {loaded,errs};
}
async function addFiles(files){ const items=[]; for(const f of files){ try{ items.push({name:f.name,text:await f.text()}); }catch(e){ toast(`Couldn't open ${f.name}.`); } } addTexts(items,'add'); }
function pastedName(text){
  // name pasted logs after the frame / scene they render, falling back to a counter
  pasteN++;
  const w=text.match(/writing file `([^']+)'/)||text.match(/registered driver: "[^"]+" \(\w+\) -> (\S+)/);
  if(w) return w[1].split(/[\\/]/).pop().replace(/\.(exr|tif{1,2}|png|jpe?g|deepexr)$/i,'')+'.log';
  const sc=text.match(/reading scene from (\S+)/)||text.match(/\[ass\] loading (\S+)/);
  if(sc) return sc[1].split(/[\\/]/).pop().replace(/\.\w+$/,'')+'.log';
  return `pasted-log-${pasteN}.log`;
}
document.getElementById('fileIn').addEventListener('change',e=>{ addFiles([...e.target.files]); e.target.value=''; });
const pp=document.getElementById('pastePanel'), ta=document.getElementById('pasteTa'), pmsg=document.getElementById('pasteMsg');
const setMsg=(t,c='')=>{ pmsg.textContent=t; pmsg.className='pmsg '+c; };
function openPaste(){ pp.hidden=false; setMsg(''); ta.focus(); ta.select(); window.scrollTo({top:0}); }
document.getElementById('pasteBtn').addEventListener('click',()=>{ if(pp.hidden) openPaste(); else pp.hidden=true; });
document.getElementById('pasteCancel').addEventListener('click',()=>{ pp.hidden=true; });
document.getElementById('pasteClear').addEventListener('click',()=>{ ta.value=''; setMsg(''); ta.focus(); });
function analyzePasted(text,keep){
  if(!text.trim()){ setMsg('Paste a log into the box first.','err'); return false; }
  const name=pastedName(text);
  setMsg('Reading…');
  const r=addTexts([{name,text}],keep?'add':'replace');
  if(r.errs.length){ setMsg(`Couldn't read this log: ${r.errs[0].split(': ').slice(1).join(': ')}`,'err'); return false; }
  const L=r.loaded[0];
  setMsg(`Loaded ${fmtInt(L.lines.length)} lines as ${name}`+(L.unrecognized?' · no Arnold timestamps found':''),L.unrecognized?'err':'ok');
  return true;
}
document.getElementById('pasteGo').addEventListener('click',()=>{ analyzePasted(ta.value,document.getElementById('pasteKeep').checked); });
ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); analyzePasted(ta.value,document.getElementById('pasteKeep').checked); } });
// Ctrl+V anywhere on the page (outside a text field) loads the clipboard straight away
document.addEventListener('paste',e=>{
  const t=e.target; if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable)) return;
  const text=e.clipboardData?.getData('text'); if(!text||!text.trim()) return;
  e.preventDefault(); ta.value=text; pp.hidden=false;
  analyzePasted(text,document.getElementById('pasteKeep').checked);
});
const drop=document.getElementById('drop'); let dc=0;
window.addEventListener('dragenter',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')){ dc++; drop.hidden=false; } });
window.addEventListener('dragleave',()=>{ dc=Math.max(0,dc-1); if(!dc) drop.hidden=true; });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dc=0; drop.hidden=true; if(e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); });

const S=parseLog(makeSample(),'sh0210_lgt_v047.1042.log'); S.sample=true; state.logs=[S];
render();
</script>
