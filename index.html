const GLOSS={
/* ---------- the big numbers ---------- */
frame_time:{cat:'Timing',t:'Frame time',
  what:'Wall-clock time Arnold spent on this frame after the scene was built: node initialisation, building acceleration structures, drivers and the actual pixel rendering. It does not include scene creation (loading USD/.ass, plugins). On the farm, the job time is roughly scene creation + frame time + writing files.',
  good:'Compare against the same shot in earlier versions or the neighbouring frames. A single frame that is 2× its neighbours usually points to one thing that changed: a new light, a texture, motion blur, an object entering frame.',
  high:'Almost always one of: too many rays per pixel (sampling), expensive shaders (SSS, hair, transmission with high depth), heavy displacement/subdivision, slow texture I/O, or threads sitting idle (low utilisation).',
  fix:['Open the Time tab. The breakdown tells you which bucket to attack: if "rendering" dominates, look at Rays & Shading; if "node init" is large, look at subdivision/displacement/procedurals.','Check rays per pixel against the sampling settings. Raising Camera AA multiplies every other sample.','Check machine utilisation. Below ~85% means threads were waiting, so fixing that is free speed.'],
  p:['AA_samples','GI_*_samples','GI_*_depth','threads'],src:['aa','depth']},
scene_creation:{cat:'Timing',t:'Scene creation time',
  what:'Time before rendering could start: loading plugins, reading the scene (USD stage, .ass, Alembic, procedurals) and translating it into Arnold nodes. Arnold prints its own machine utilisation for this phase too.',
  good:'A few seconds for a light shot. Tens of seconds are common for big USD stages. It is mostly single-threaded, so utilisation of 5–25% here is normal and not a problem in itself.',
  high:'Huge USD layer stacks, many unique procedurals, unoptimised Alembic, network latency when reading caches, many plugin search paths.',
  fix:['Bake heavy, static assets to .ass stand-ins or USD with payloads you can deactivate.','Point plugin search paths only at what you need: every path is scanned at start-up.','Read caches from local or fast storage on the farm.'],
  p:['procedural_searchpath','plugin_searchpath'],src:['speclog']},
utilization:{cat:'Timing',t:'Machine utilisation',
  what:'Percentage of the available CPU time (threads × wall time) that Arnold actually used during the phase. 100% means every thread was busy for the whole frame.',
  good:'85–98% for frame time on a normal CPU render. Scene creation is expected to be low.',
  high:'Low values (the problem case) come from threads waiting: single-threaded phases inside frame time (some procedural expansion, subdivision on one big mesh), texture loading stalls when the cache is too small or storage is slow, locks in custom shaders/OSL, a wide pixel filter or contour filter, or more threads than the job is allowed to use on the farm.',
  fix:['Look at "thread blocked" in self-time by category. If it is large, textures or a lock are the cause.','Convert textures to tiled, mipmapped .tx and raise the texture cache if you see redundant reads.','Make sure the farm slot gives Arnold the cores it thinks it has (threads = 0 means "all logical cores").','Rendering at a size that divides into the bucket size avoids a tail of half-empty buckets at the end of the frame.'],
  p:['threads','bucket_size','texture_max_memory_MB'],src:['threads']},
peak_memory:{cat:'Memory',t:'Peak CPU memory',
  what:'The highest amount of RAM the Arnold process used during the render, with Arnold\'s own breakdown of where it went. This is the number that decides whether a frame fits on a farm machine.',
  good:'Comfortably below the RAM of the smallest farm machine class, with room for the OS and a second job if you run two per node. Under 50% of host RAM is a safe target.',
  high:'Geometry (usually subdivision and displacement multiplying triangle counts), user data/primvars exported with meshes, acceleration structures, the texture cache, many AOVs at high resolution, and memory the host application holds ("unaccounted").',
  fix:['Expand the Memory tab tree. The largest child is where to look.','Lower subdivision iterations or use adaptive subdivision with a larger error.','Strip primvars/user data no shader reads.','The texture cache is capped. Lowering its limit trades memory for I/O.'],
  p:['subdiv_iterations','subdiv_adaptive_error','texture_max_memory_MB'],src:['speclog']},
resolution:{cat:'Image',t:'Resolution and AA',
  what:'Output size in pixels and the camera (AA) samples. Arnold traces AA² camera samples per pixel. With adaptive sampling on, noisy pixels can go up to AA_samples_max².',
  good:'Final-quality shots commonly sit at AA 3–6 with adaptive on. Higher AA is mostly needed for motion blur, depth of field and fine hair.',
  high:'n/a',fix:['Render tests at half resolution: time scales roughly with pixel count.'],p:['AA_samples','AA_samples_max','xres','yres'],src:['aa']},
rays_per_pixel:{cat:'Rays',t:'Rays per pixel',
  what:'Total rays of every type traced, divided by the number of pixels. Every ray costs time, so this is the single best "how expensive is my sampling" number. Arnold itself prints a performance warning when it is very high.',
  good:'A few hundred to ~1,500 is typical for production frames. Arnold warns around 2,000+ ("You are tracing N rays per pixel").',
  high:'Camera AA multiplies everything: AA 6 = 36 camera samples, and each one fires diffuse² + specular² + light samples² … rays at every bounce. Many lights each fire their own shadow rays. High ray depths repeat all of that per bounce.',
  fix:['Lower Camera AA first and compensate with adaptive sampling (AA_samples_max) instead of a high fixed AA.','Bring diffuse/specular/transmission samples down to 1–2 when AA is high; they multiply.','Use Global Light Sampling for scenes with many lights instead of per-light samples.','Lower ray depths you do not need. Each extra bounce can nearly double cost.'],
  p:['AA_samples','GI_diffuse_samples','GI_specular_samples','GI_transmission_samples','light samples'],src:['aa','lights','depth']},
issues:{cat:'Log',t:'Errors and warnings',
  what:'ERROR lines mean Arnold could not do something it was asked to: a file was missing, a node failed, a licence could not be checked out. WARNING lines mean it did something, but maybe not what you intended.',
  good:'Zero errors. Warnings are fine when you know what they are; a clean log makes the next real problem easy to spot.',
  high:'n/a',fix:['Open the Warnings tab: identical messages are grouped so 30,000 lines become a handful of real issues.','Hover a warning for what it means and the usual fix.'],p:[],src:['getlog']},
wall_phases:{cat:'Timing',t:'Wall-clock phases',
  what:'Built from the timestamp at the start of every log line: when plugin loading, scene loading, node init, acceleration build, rendering, file writing and shutdown started. Unlike the stats block, this includes everything, so it tells you where farm time actually went.',
  good:'Rendering should be the widest segment. If scene load or output write is a big share, the frame is I/O bound, not render bound.',
  high:'Slow storage, huge EXRs with many AOVs and heavy compression, very large scenes to read.',
  fix:['Use faster EXR compression (e.g. DWAA for beauty passes, zip per scanline for data passes) if writing is slow.','Move caches closer to the render nodes.'],p:['driver compression'],src:[]},
/* ---------- frame-time tree ---------- */
node_init:{cat:'Timing',t:'Node init',
  what:'Time spent preparing every node before the first ray: subdividing and displacing meshes, expanding procedurals, building acceleration structures (BVH) and importance maps.',
  good:'Small compared to rendering, a few percent of frame time.',
  high:'High subdivision iterations, displacement on dense meshes, many unique procedurals, many instances of huge meshes.',
  fix:['Use adaptive subdivision (subdiv_adaptive_error 0.5–1 px) instead of fixed high iterations.','Only displace objects close to camera; use autobump or normal maps for the rest.','Cache expensive procedurals.'],
  p:['subdiv_iterations','subdiv_adaptive_error','disp_height'],src:[]},
subdivision:{cat:'Geometry',t:'Subdivision',
  what:'Time spent turning low-poly cages into smooth surfaces. Each Catmull-Clark iteration multiplies the face count by about 4, so 4 iterations = ~256× the polygons.',
  good:'Small next to rendering. Adaptive subdivision keeps distant objects light.',
  high:'Fixed iteration counts on everything, adaptive metric set too fine, subdividing objects that are far from camera or out of frustum.',
  fix:['Switch to adaptive: subdiv_adaptive_error around 0.5–1 pixel, subdiv_adaptive_space "raster".','Set subdiv_frustum_culling for big environments.','Cap subdiv_iterations; the adaptive error stops earlier when it can.'],
  p:['subdiv_type','subdiv_iterations','subdiv_adaptive_error','subdiv_adaptive_metric','subdiv_frustum_culling'],src:[]},
displacement:{cat:'Geometry',t:'Displacement',
  what:'Time spent moving subdivided vertices along the displacement map. It needs enough subdivision to have vertices to move, and the result is stored as real geometry (memory).',
  good:'Proportional to how much displaced geometry is near camera.',
  high:'Displacing far-away objects, very high subdivision under the displacement, 32-bit float displacement maps read at full resolution.',
  fix:['Use disp_autobump for fine detail instead of more subdivision.','Set disp_padding to the real maximum displacement. Too small clips geometry; too large wastes bounding volume.'],
  p:['disp_height','disp_padding','disp_zero_value','disp_autobump'],src:['disp']},
accel:{cat:'Geometry',t:'Acceleration structures (BVH)',
  what:'Arnold builds a bounding volume hierarchy so each ray only tests the few triangles near its path. It is built once per frame (per motion key) and kept in memory.',
  good:'Seconds, multithreaded. Memory usually a fraction of geometry memory.',
  high:'Many motion keys (deformation blur), hundreds of millions of unique triangles.',
  fix:['Reduce deformation motion keys where the motion is linear.','Instance repeated assets instead of duplicating them.'],p:['motion keys','instancing'],src:[]},
driver:{cat:'Timing',t:'Driver init/close',
  what:'Time spent opening output drivers (EXR, display) and writing/closing the files at the end of the frame.',
  good:'A second or two.',high:'Many AOVs, deep EXR, slow compression, slow network storage.',
  fix:['Check the AOV list (System tab) for passes nobody uses.','Choose a faster EXR compression for large data AOVs.'],p:['driver_exr compression','half_precision'],src:[]},
rendering:{cat:'Timing',t:'Rendering',
  what:'Time inside the bucket loop: tracing rays and running shaders for every pixel. This is where sampling, lights and shaders cost time.',
  good:'The biggest share of frame time. That is what you want; the rest is overhead.',
  high:'See rays per pixel, shader self-times and texture I/O.',
  fix:['Go to Rays & Shading to see which ray type dominates.','Use self-time by node to find the material or light that costs the most.'],p:[],src:[]},
pixel_rendering:{cat:'Timing',t:'Pixel rendering',
  what:'The part of rendering spent actually computing pixels (as opposed to importance maps and setup inside the render phase).',
  good:'Close to "rendering".',high:'See rays per pixel.',fix:[],p:[],src:[]},
importance_maps:{cat:'Lighting',t:'Importance maps',
  what:'Precomputed maps that tell Arnold where the bright areas of a skydome or textured light are, so it sends shadow rays there instead of everywhere.',
  good:'Under a second.',high:'Very high skydome resolution.',
  fix:['Skydome resolution only needs to match the detail in the HDRI that matters for lighting; 1–2k is usually enough.'],p:['skydome_light.resolution'],src:['lights']},
unaccounted_time:{cat:'Timing',t:'Unaccounted / system time',
  what:'Time inside the phase that Arnold did not attribute to one of its own categories: host application work, plugins, OS, waiting on I/O.',
  good:'A few percent.',high:'Interactive sessions (Maya/Houdini doing work alongside Arnold), custom plugins, slow file systems.',
  fix:['Compare a kick/command-line render of the same .ass: if the unaccounted time disappears, the host app is the cause.'],p:[],src:[]},
thread_blocked:{cat:'Timing',t:'Thread blocked',
  what:'Summed time that render threads spent waiting on a lock instead of working. It is the clearest signal of lost CPU.',
  good:'Under ~2–3% of the session.',
  high:'Texture cache misses on untiled/unmipped images (one thread reads the whole file while others wait), a texture cache that is too small, slow storage, single-threaded procedural expansion, custom shaders that lock.',
  fix:['Convert every texture to .tx (tiled + mipmapped).','Raise texture_max_memory_MB if the Textures tab shows redundant reads.','Copy textures to local SSD on the render nodes if I/O time is high.'],
  p:['texture_max_memory_MB','texture_max_open_files'],src:['threads','tx']},
self_time_cat:{cat:'Timing',t:'Self time by category',
  what:'Profiling data summed across all threads: how much CPU time each kind of work took, excluding time spent in its children. Because it is summed over threads it can be far larger than wall time.',
  good:'Shaders and BVH traversal at the top is normal.',
  high:'A light type or a single shader type dominating means that is where to optimise.',
  fix:['Hover a row for what that category covers.'],p:[],src:['stats']},
self_time_node:{cat:'Timing',t:'Self time by node',
  what:'The same profiling data but per node: which exact material, light or mesh cost the most CPU time.',
  good:'The hero material and the key light at the top is normal.',
  high:'A background object, a small light or a utility shader near the top is suspicious.',
  fix:['Simplify the top materials: fewer layers, lower SSS/transmission depth, cheaper noise.','For lights near the top: check their samples, size, and whether a light filter (gobo, blocker) is expensive.'],p:[],src:['stats']},
progress:{cat:'Timing',t:'Render progress',
  what:'The "NN% done – N rays/pixel" lines Arnold prints while buckets finish. A straight line means every part of the image costs the same; a steep part means cheap buckets, a flat part means expensive ones.',
  good:'Any shape is fine; it shows where the cost is in the image.',
  high:'A long flat tail usually means a few very expensive buckets (hair, glass, volumes) or idle threads at the end.',
  fix:['Use the render speed chart: dips line up with expensive regions.','Try a smaller bucket size so the last expensive buckets are shared between more threads.'],p:['bucket_size','bucket_scanning'],src:[]},
render_speed:{cat:'Timing',t:'Render speed',
  what:'Derived from consecutive progress lines: how much of the image was finished per minute. It is a timeline of where the cost sits in the frame.',

mem_over_time:{cat:'Memory',t:'Memory over time',

mem_startup:{cat:'Memory',t:'At startup',what:'Memory the process already had before Arnold started rendering: the host application (Maya, Houdini) and libraries.',good:'Small for kick; large in an interactive DCC.',high:'Rendering inside a heavy DCC session.',fix:['Render with kick or husk on the farm to avoid paying for the DCC.'],p:[],src:[]},
mem_plugins:{cat:'Memory',t:'Plugins',what:'Memory used by loaded shader/procedural plugin libraries.',good:'Tens of MB.',high:'Many plugin paths with big libraries.',fix:['Only load the plugin paths you need.'],p:['plugin_searchpath'],src:[]},
aov_samples:{cat:'Memory',t:'AOV samples',what:'Per-sample storage for AOVs while buckets render.',good:'Hundreds of MB at most.',high:'Many AOVs, deep output, large bucket size.',fix:['Remove unused AOVs; use smaller buckets with deep output.'],p:['bucket_size'],src:[]},
output_buffers:{cat:'Memory',t:'Output buffers / framebuffers',what:'Full-resolution buffers that hold each AOV before it is written.',good:'Scales with resolution × AOV count × channels.',high:'4K+ with many RGBA float AOVs.',fix:['Use half-float for beauty-type AOVs.'],p:['half_precision'],src:[]},

geometry_mem:{cat:'Memory',t:'Geometry',what:'Vertices, indices, normals, UVs and user data of every mesh, curve, point and volume after subdivision and displacement.',good:'Usually the biggest memory consumer in production scenes.',high:'Subdivision iterations, displacement, dense curves (hair/fur), unneeded primvars.',fix:['Expand the tree: if "userdata" is large, strip primvars; if "vertices" dominate, reduce subdivision.'],p:['subdiv_iterations'],src:[]},

accel_structs:{cat:'Memory',t:'Accel structs',what:'Memory for the BVH acceleration structures.',good:'A fraction of geometry memory.',high:'Many motion keys, many unique triangles.',fix:['Reduce motion keys; instance repeated geometry.'],p:[],src:[]},
texture_cache_mem:{cat:'Memory',t:'Texture cache',what:'Uncompressed texture tiles held in RAM. It is capped by texture_max_memory_MB; when full, old tiles are thrown away and may be read again later.',good:'At or below its limit. Hitting the limit is fine if redundant reads stay low.',high:'Not a problem by itself: the cap prevents it growing. Untiled textures can bypass the efficient path.',fix:['Raise the limit if the Textures tab shows redundant reads and you have RAM to spare; lower it to save RAM if there are none.'],p:['texture_max_memory_MB'],src:['tx','oiio']},
strings:{cat:'Memory',t:'Strings',what:'Node names, parameter strings, file paths.',good:'Tens of MB.',high:'Millions of uniquely named nodes.',fix:['Usually nothing to do.'],p:[],src:[]},
unaccounted_mem:{cat:'Memory',t:'Unaccounted memory',what:'Memory the process used that Arnold did not allocate itself: the host application, plugins, USD stages, OSL, libraries. Arnold notes "(interactive session)" when rendering inside a DCC.',good:'Small for kick/husk farm renders.',high:'Rendering inside Maya/Houdini, USD stages kept alive, custom procedurals.',fix:['Compare with a kick/husk render of the same scene.','Check the procedural or plugin that loads the most data.'],p:[],src:['speclog']},
host_headroom:{cat:'Memory',t:'Host headroom',what:'Peak memory compared with the machine\'s RAM (and GPU memory, if listed).',good:'Under 50% leaves space for a second job; under 80% is the hard comfort limit.',high:'n/a',fix:['If two frames per node do not fit, either reduce memory or schedule one frame per node for this shot.'],p:[],src:[]},
/* ---------- rays ---------- */
ray_camera:{cat:'Rays',t:'Camera rays',what:'Primary rays from the camera, one per AA sample. Camera rays/pixel ≈ AA² (between AA² and AA_max² with adaptive sampling).',good:'Equal to AA² without adaptive; between AA² and AA_max² with it.',high:'Adaptive sampling pushing many pixels to the maximum (noisy areas, motion blur, DOF).',fix:['If camera rays are close to AA_max², the adaptive threshold is too strict or the noise comes from elsewhere. Raise the threshold slightly or fix the noise source.'],p:['AA_samples','AA_samples_max','adaptive_threshold'],src:['aa']},
ray_shadow:{cat:'Rays',t:'Shadow rays',what:'Rays sent towards lights to test if a point is lit. For each shading point, each light sends samples² shadow rays (and that is multiplied by AA² per pixel).',good:'Often the largest category. That is expected with many lights.',high:'Many lights, high light samples, large area lights, skydome with low importance-map resolution.',fix:['Lower per-light samples on lights that do not contribute visible noise.','Use Global Light Sampling for scenes with many lights.','Remove lights that contribute almost nothing (check light group AOVs).'],p:['light samples','Global Light Sampling'],src:['lights','gls']},
ray_diffuse_reflect:{cat:'Rays',t:'Diffuse reflection rays',what:'Indirect diffuse bounce (GI) rays. Each camera sample that hits a diffuse surface sends diffuse_samples² rays.',good:'Proportional to diffuse samples² × AA².',high:'High diffuse samples with high AA, deep diffuse ray depth in interiors.',fix:['Diffuse samples 2–3 with AA 3–5 is a common starting point.','Diffuse depth 1–2 is enough for most exteriors.'],p:['GI_diffuse_samples','GI_diffuse_depth'],src:['depth']},
ray_diffuse_transmit:{cat:'Rays',t:'Diffuse transmission rays',what:'Diffuse light going through thin surfaces (leaves, paper, lampshades).',good:'Small.',high:'Large areas of thin translucent geometry.',fix:['Limit diffuse transmission to materials that need it.'],p:['GI_diffuse_samples'],src:[]},
ray_specular_reflect:{cat:'Rays',t:'Specular reflection rays',what:'Glossy and mirror reflection rays.',good:'Proportional to specular samples² × AA².',high:'Rough reflections (more noise, more samples), deep specular depth.',fix:['Specular depth 1–2 is usually enough; mirror rooms are the exception.','Use indirect_specular_blur to make deep specular bounces converge faster.'],p:['GI_specular_samples','GI_specular_depth','indirect_specular_blur'],src:['depth']},
ray_specular_transmit:{cat:'Rays',t:'Specular transmission rays',what:'Refraction rays through glass, water and liquids.',good:'Depends on how much glass/water is in frame.',high:'Transmission depth set high (8+), many overlapping glass surfaces.',fix:['Lower GI_transmission_depth to the number of glass surfaces a ray really needs to pass (often 4–6).','Use thin_walled for windows.'],p:['GI_transmission_samples','GI_transmission_depth'],src:['depth']},
ray_volume_scattering:{cat:'Rays',t:'Volume scattering rays',what:'Rays that scatter inside volumes (smoke, fog, clouds).',good:'Small unless volumes are in frame.',high:'Dense volumes with high volume depth and samples.',fix:['Volume depth 0–1 is enough for most fog; clouds need more.','Increase volume step size where detail allows.'],p:['GI_volume_samples','GI_volume_depth','step_size'],src:[]},
ray_subsurface:{cat:'Rays',t:'SSS rays',what:'Rays used to sample subsurface scattering (skin, wax, marble).',good:'Proportional to SSS area on screen.',high:'High SSS samples, large SSS radius in scene units.',fix:['SSS samples 2 is usually enough with AA 4+.','Check scene scale: a radius set for centimetres in a metre scene is 100× too large.'],p:['GI_sss_samples','subsurface_radius'],src:[]},
ray_total:{cat:'Rays',t:'Total rays',what:'All rays traced for the frame.',good:'See rays per pixel.',high:'',fix:[],p:[],src:[]},
avg_hits:{cat:'Rays',t:'Avg. hits',what:'Average number of surfaces a ray of this type hit. Below 1 means some rays escaped to the background. Shadow rays above 1 mean many semi-transparent occluders (each hit evaluates opacity).',good:'≤ 1 for most types.',high:'Shadow rays with high hit counts: foliage cards, hair, layered transparent geometry.',fix:['Make shaders opaque where they do not need transparency. Since Arnold 5.3 the opaque flag is ignored for built-in shaders, so set opacity to 1 or use a ray switch for shadows.'],p:['opacity','auto_transparency_depth'],src:['opaque']},
ray_depth:{cat:'Rays',t:'Rays by bounce depth',what:'Share of rays traced at each bounce: depth 0 is the first hit from the camera, 1 the first bounce, and so on.',good:'Most rays at depth 0–1.',high:'A big share at depth 3+ means deep bounces are expensive and probably barely visible.',fix:['Lower the ray depth for the type that shows deep shares.','Try depth -1 and compare images: if you cannot see the difference, keep it.'],p:['GI_total_depth','GI_*_depth'],src:['depth']},
shader_primary:{cat:'Shading',t:'Primary shader calls',what:'Full shader evaluations at ray hits.',good:'Roughly proportional to rays.',high:'',fix:[],p:[],src:[]},
shader_transparent_shadow:{cat:'Shading',t:'Transparent shadow calls',what:'Shader evaluations just to find out how transparent a surface is to a shadow ray. They happen for every shadow ray that hits a non-opaque surface.',good:'Small compared with primary calls.',high:'Foliage with opacity maps, hair, or materials with transmission or opacity that do not need it for shadows.',fix:['Make materials fully opaque when they are not see-through.','Use a ray switch so the shadow ray sees an opaque version.'],p:['opacity','transmission'],src:['opaque']},
shader_autobump:{cat:'Shading',t:'Autobump calls',what:'Extra displacement shader evaluations used to compute bump from displacement detail that is too fine for the mesh.',good:'Small.',high:'Autobump enabled on many objects with expensive displacement networks.',fix:['Turn off disp_autobump on objects where the detail is not visible.'],p:['disp_autobump'],src:[]},
shader_background:{cat:'Shading',t:'Background calls',what:'Shader evaluations for rays that hit nothing and see the background or skydome.',good:'Small.',high:'',fix:[],p:[],src:[]},
shader_importance:{cat:'Shading',t:'Importance calls',what:'Evaluations used to build importance maps for textured lights.',good:'Small.',high:'Very high skydome resolution.',fix:[],p:[],src:[]},
/* ---------- settings ---------- */
aa:{cat:'Sampling',t:'Camera (AA) samples',what:'Samples per pixel edge: AA 4 = 16 camera samples per pixel. It also multiplies every other sample type, because every camera sample spawns its own diffuse, specular and shadow rays.',good:'3–6 for most final frames. Motion blur, DOF and fine hair may need more.',high:'',fix:['Raise AA for motion blur/DOF noise; raise a specific sample type (diffuse, specular, light) for noise in that component only.'],p:['AA_samples'],src:['aa']},
adaptive:{cat:'Sampling',t:'Adaptive sampling',what:'Lets each pixel stop at AA² samples when it is clean, or keep going up to AA_samples_max² when it is noisy. The threshold is the noise level that counts as clean (lower = cleaner and slower).',good:'Threshold around 0.01–0.02 is common.',high:'',fix:['Compare camera rays/pixel to AA² and AA_max²: near the max means most pixels never got clean.'],p:['enable_adaptive_sampling','AA_samples_max','adaptive_threshold'],src:['aa']},
clamp:{cat:'Sampling',t:'AA sample clamp',what:'Caps the value of any single sample to kill fireflies. It makes the image slightly darker in very bright areas.',good:'Often 5–10 when used; disabled by default.',high:'',fix:['Prefer fixing the source of fireflies (tiny bright lights, rough-to-sharp specular paths) before clamping.'],p:['AA_sample_clamp','AA_sample_clamp_affects_aovs'],src:[]},
samples_diffuse:{cat:'Sampling',t:'Diffuse samples / depth',what:'Samples: rays per camera sample for indirect diffuse (squared). Depth: how many diffuse bounces are followed.',good:'Samples 2–3, depth 1–2 for most scenes; interiors may need depth 2–3.',high:'',fix:['Each extra depth level can nearly double the cost of that ray type.'],p:['GI_diffuse_samples','GI_diffuse_depth'],src:['depth']},
samples_specular:{cat:'Sampling',t:'Specular samples / depth',what:'Glossy reflection samples (squared) and bounce depth.',good:'Samples 2, depth 1–2.',high:'',fix:[],p:['GI_specular_samples','GI_specular_depth'],src:['depth']},
samples_transmission:{cat:'Sampling',t:'Transmission samples / depth',what:'Refraction samples (squared) and how many glass/liquid surfaces a ray can pass through.',good:'Depth 4–8 depending on how much glass is layered.',high:'',fix:['Too low depth shows black in glass; too high costs time with no visible change.'],p:['GI_transmission_samples','GI_transmission_depth'],src:['depth']},
samples_volume:{cat:'Sampling',t:'Volume samples / depth',what:'Indirect volume scattering samples and depth. Depth 0 means volumes only receive direct light.',good:'Depth 0 for thin fog; 1–2 for clouds.',high:'',fix:[],p:['GI_volume_samples','GI_volume_depth'],src:[]},
samples_sss:{cat:'Sampling',t:'SSS samples',what:'Subsurface scattering samples (squared) per camera sample.',good:'2.',high:'',fix:[],p:['GI_sss_samples'],src:[]},
total_depth:{cat:'Sampling',t:'Total depth',what:'Overall limit on combined bounces of any type. A ray stops when either its own depth or the total depth is reached.',good:'Around 10.',high:'',fix:[],p:['GI_total_depth'],src:[]},
transparency_depth:{cat:'Sampling',t:'Transparency depth',what:'How many transparent (opacity) surfaces a ray can pass through before stopping. Matters for stacked foliage cards and hair.',good:'10–20 for foliage; lower for scenes without opacity.',high:'',fix:['Too low turns dense foliage black or solid.'],p:['auto_transparency_depth'],src:[]},
threads:{cat:'System',t:'Threads',what:'How many render threads Arnold used. 0 or negative values in the settings mean "all logical cores minus that number".',good:'Equal to the logical cores the farm slot gives the job.',high:'',fix:['If threads > the cores the job is allowed, threads fight each other and utilisation drops.'],p:['threads'],src:['threads']},
buckets:{cat:'System',t:'Buckets',what:'The image is rendered in square tiles, one per thread at a time.',good:'64×64 is the common default.',high:'',fix:['Smaller buckets balance expensive regions better near the end of a frame; bigger buckets have less overhead.'],p:['bucket_size','bucket_scanning'],src:[]},
/* ---------- textures ---------- */
tex_unique:{cat:'Textures',t:'Unique images',what:'How many different texture files were opened during the render.',good:'Any number, as long as they are .tx.',high:'',fix:[],p:[],src:['tx']},
tex_referenced:{cat:'Textures',t:'Referenced data',what:'Uncompressed size of all referenced textures at full resolution (all MIP levels), compared with their compressed size on disk. The texture cache works on uncompressed data, which is why this is larger than the files.',good:'Can be far bigger than RAM. That is fine; the cache streams tiles.',high:'',fix:[],p:[],src:['oiio']},
tex_read:{cat:'Textures',t:'Pixel data read',what:'How much texture data was actually loaded. With tiled, mipmapped .tx files this is a small fraction of the referenced size because only visible tiles at the needed MIP level are read.',good:'A small percentage of referenced data.',high:'Untiled/unmipped files (read in full), textures seen very close up, cache too small (tiles read again).',fix:['Convert the files that read the most (Textures tab, "MB read") to .tx.'],p:[],src:['tx']},
tex_io:{cat:'Textures',t:'File I/O time',what:'Time spent reading texture files, summed over all threads. Long I/O usually means slow or busy network storage.',good:'A small fraction of frame time (remember it is summed over threads).',high:'Network storage under load, many small files, untiled files read whole.',fix:['Localise textures on render nodes or use a caching proxy.','Use .tx files so less data is read.'],p:[],src:['oiio']},
tex_peak:{cat:'Textures',t:'Peak cache memory',what:'The most memory the texture cache used. It stops growing at texture_max_memory_MB and starts evicting tiles.',good:'Below the limit, or at the limit with very few redundant reads.',high:'',fix:['At the limit with many redundant reads: raise the limit.'],p:['texture_max_memory_MB'],src:['oiio']},
tex_main_miss:{cat:'Textures',t:'Main cache misses',what:'Tile requests that were not in memory and had to be read from disk.',good:'Well under 1% of tile requests.',high:'Cache too small for the frame, very large textures seen at full resolution.',fix:['Raise texture_max_memory_MB, and check MIP usage.'],p:['texture_max_memory_MB'],src:['oiio']},
tex_micro_miss:{cat:'Textures',t:'Micro-cache misses',what:'Misses in the small per-thread cache in front of the main cache. Cheap compared with main misses.',good:'A few percent.',high:'',fix:[],p:[],src:['oiio']},
tex_redundant:{cat:'Textures',t:'Redundant reads',what:'Tiles that were read, thrown out of the cache because it was full, then needed and read again. It is wasted I/O.',good:'Zero or close to it.',high:'texture_max_memory_MB too small for the textures this frame needs.',fix:['Raise texture_max_memory_MB until redundant reads drop to ~0.'],p:['texture_max_memory_MB'],src:['oiio']},
flag_untiled:{cat:'Textures',t:'UNTILED',what:'The file is stored as scanlines, not tiles. Arnold has to read and keep large parts of it at once instead of streaming small tiles.',good:'No untiled textures in production.',high:'JPG, PNG, scanline EXR, HDRIs straight from the internet.',fix:['Convert with maketx (or let the DCC auto-generate .tx), and point the shader at the .tx.'],p:['texture_autotile','texture_accept_untiled'],src:['tx','htoatex']},
flag_unmipped:{cat:'Textures',t:'UNMIPMAPPED',what:'The file has no pre-filtered smaller versions. Arnold must read the full resolution even when the object is far away, and textures shimmer at low AA.',good:'No unmipped textures in production.',high:'',fix:['maketx builds the MIP chain once instead of every frame.'],p:['texture_automip','texture_accept_unmipped'],src:['tx']},
flag_nottx:{cat:'Textures',t:'Not a .tx file',what:'The file is not in Arnold\'s preferred texture format. It may still be tiled and mipped (some EXRs are), but usually it is not.',good:'.tx (or tiled, mipmapped EXR).',high:'',fix:['Enable auto-generate TX in the render settings, or batch convert with maketx.'],p:['texture_auto_generate_tx'],src:['htoatex']},
tex_mipmapped:{cat:'Textures',t:'Mipmapped',what:'A mipmapped texture stores the image plus pre-filtered copies at half, quarter, eighth… resolution, down to 1 pixel (a 4096 px image has 13 levels). Arnold reads the level that matches how big the texture is on screen, so distant objects read a tiny level instead of the full image. "Yes · N levels" comes from OpenImageIO\'s MIP-COUNT for that file; "No" means it printed UNMIPPED or the file has a single level.',good:'Every production texture mipmapped (.tx from maketx or the DCC\'s auto-TX).',high:'',fix:['Convert the "No" files with maketx, or turn on auto-generate TX, and point the shaders at the .tx.','If a file has fewer levels than the full chain, it was converted with a limited mip count; reconvert with default settings.'],p:['texture_auto_generate_tx','texture_automip','texture_accept_unmipped'],src:['tx','htoatex']},
mip_reads:{cat:'Textures',t:'MIP levels used',what:'Each bar is one mip level, from full resolution (left) to 1 pixel (right); its height is how many tiles the render read at that level (log scale). It shows how big the texture really was on screen. MIP-UNUSED means the file has mip levels but only full resolution was ever read.',good:'Reads spread over the levels that match screen size. A background prop should read mostly small levels.',high:'Reads only at level 0 on a distant object: the texture is very close to camera, the UVs are scaled down a lot, or a blur/filter setting forces full resolution.',fix:['If a hero texture only reads level 0, it may need more resolution (it is magnified).','If a background texture only reads level 0, check UV tiling and filter settings on the image node.'],p:['filter','mipmap_bias'],src:['oiio']},
flag_ok:{cat:'Textures',t:'Tiled and mipmapped',what:'The file can be streamed tile by tile at the MIP level the render needs. This is the ideal case.',good:'',high:'',fix:[],p:[],src:['tx']},
tex_queries:{cat:'Textures',t:'Texture lookups',what:'How many texture lookups shaders made and how they were batched.',good:'Large numbers are normal.',high:'',fix:[],p:[],src:['oiio']},
/* ---------- geometry ---------- */
geo_objtime:{cat:'Geometry',t:'Time per object',what:'How long each mesh, procedural or asset took. "Profiled" times are Arnold\'s own self-time measurements (top session self-times by node, or a profile .json). "Estimated" times come from the log: the gap between the line that names the object during node init and the next log line, so they have one-second resolution and only cover objects Arnold prints a line for (subdivision, displacement, procedural/USD loading).',good:'A few heavy hero assets at the top, everything else small.',high:'Subdivision iterations, displacement, expanding big procedurals or USD payloads, many instances.',fix:['Group by parent or top level to see the total per asset or HDA.','For HDA cook time in Houdini itself (before Arnold starts), use Houdini\'s Performance Monitor: Arnold only sees the geometry the HDA produced.','For exact per-object times, render with options.profile_file and drop the profile .json here.'],p:['profile_file','subdiv_iterations','subdiv_adaptive_error','disp_height'],src:['stats']},
aov_audit:{cat:'AOVs',t:'AOV audit',what:'Every AOV Arnold rendered, the driver it went to, its filter and an estimate of its full-frame buffer. Red flags come from the log itself: an AOV sent to the same driver twice, or one Arnold warned about. Orange flags are worth checking: data passes blurred by a smooth filter, passes that only go to the render view, unusually heavy passes. Arnold never knows which passes your comp reads, so the log alone cannot prove a pass is unused.',good:'No duplicates, data AOVs with closest_filter, only passes comp needs.',high:'Template ROPs carrying every pass for every shot; light-group AOVs for groups that no longer exist.',fix:['Remove red AOVs from the ROP; check orange ones.','Every AOV adds render time (shading writes), memory (AOV samples, output buffers) and file size.'],p:['outputs','aov_shaders','half_precision'],src:[]},
geo_table:{cat:'Geometry',t:'Geometry statistics',what:'How many objects of each type the scene contained, how often they were hit by rays, and how many triangles they produced after tessellation. "init mem" vs "final mem" shows memory before and after subdivision/displacement.',good:'Visible triangles should be close to unique triangles × instance use.',high:'Subdivided triangles dwarfing everything else; hit % of 0 on heavy objects (they cost memory and init time but were never seen).',fix:['Objects with 0% hits are candidates to hide or make invisible to camera and rays.'],p:['visibility','subdiv_frustum_culling'],src:['speclog']},
scene_bounds:{cat:'Geometry',t:'Scene bounds',what:'The bounding box of all geometry. A box far bigger than the set means stray geometry somewhere far away, which hurts the BVH.',good:'Close to the size of your set.',high:'Stray points or objects at huge coordinates.',fix:['Find and delete geometry far outside the set.'],p:[],src:[]},
/* ---------- compare ---------- */
cmp_throughput:{cat:'Timing',t:'Throughput (rays per second)',what:'Total rays traced divided by the time spent rendering pixels. It measures how fast each ray is, independent of how many rays the settings asked for. Per thread, it lets you compare machines with different core counts fairly.',good:'Stable across frames of the same shot on the same hardware.',high:'Low throughput means each ray is expensive: heavy shaders (SSS, layered, OSL), dense or displaced geometry, texture I/O stalls, or threads waiting.',fix:['Same rays/pixel but lower throughput: look at self-time by node and texture I/O.','Different machines: compare throughput per thread, not frame time.'],p:[],src:[]},
cmp_corehours:{cat:'Timing',t:'Core-hours',what:'Frame time × threads used ÷ 3600. It is what the frame costs the farm in CPU time, so it is fair across machines with different core counts. Multiply by your farm cost per core-hour for money.',good:'Use it to budget a shot: core-hours per frame × frame count.',high:'',fix:[],p:['threads'],src:[]},
/* ---------- system ---------- */
oiio_lib:{cat:'System',t:'Library versions',what:'Third-party libraries Arnold was built with: OpenImageIO (textures), OSL (shading), OpenVDB (volumes), OptiX (GPU denoise/render).',good:'',high:'',fix:['Mismatched library versions between Arnold and custom plugins can crash; compare when a plugin fails to load.'],p:[],src:[]},
color_mgmt:{cat:'System',t:'Colour management',what:'The OCIO config and the rendering (working) colour space. Every texture is converted into this space.',good:'ACEScg on ACES pipelines.',high:'',fix:['"unable to determine chromaticities" means Arnold could not identify the working space from the config: check the OCIO roles.'],p:['color_manager','rendering color space'],src:['chroma']},

/* Which explanation goes with a label printed by Arnold (tree rows, categories, ray names…) */
const GMAP=[
  [/^frame time|^render time/i,'frame_time'],[/^scene creation/i,'scene_creation'],[/node init/i,'node_init'],[/subdiv/i,'subdivision'],[/displac/i,'displacement'],
  [/accel/i,'accel'],[/driver/i,'driver'],[/^pixel rendering/i,'pixel_rendering'],[/^rendering/i,'rendering'],[/importance/i,'importance_maps'],
  [/unaccounted|system/i,'unaccounted_time'],[/thread blocked/i,'thread_blocked'],[/BVH/i,'accel'],[/plugin/i,'mem_plugins'],
];
const GMAP_MEM=[
  [/^peak/i,'peak_memory'],[/startup/i,'mem_startup'],[/plugin/i,'mem_plugins'],[/AOV samples/i,'aov_samples'],[/output buffers|framebuffers/i,'output_buffers'],
  [/memory pools/i,'memory_pools'],[/^geometry|polymesh|curves|instances|subdivs|vertices|indices|normals|uv/i,'geometry_mem'],[/user ?data/i,'userdata'],[/accel/i,'accel_structs'],
  [/texture cache/i,'texture_cache_mem'],[/strings/i,'strings'],[/unaccounted/i,'unaccounted_mem'],[/importance/i,'importance_maps'],[/node overhead|message passing|instance overhead/i,'memory_pools'],
];
function gkey(label,kind){
  const l=String(label||'');
  if(kind==='mem'){ for(const [re,k] of GMAP_MEM) if(re.test(l)) return k; return 'peak_memory'; }
  if(kind==='ray'){ if(/^(sss|bssrdf|subsurface)$/i.test(l)) return 'ray_subsurface'; const k='ray_'+l.toLowerCase().replace(/\s+/g,'_'); return GLOSS[k]?k:null; }
  if(kind==='shader'){ const k='shader_'+l.toLowerCase().replace(/\s+/g,'_'); return GLOSS[k]?k:null; }
  if(kind==='sample'){ const m={diffuse:'samples_diffuse',specular:'samples_specular',transmission:'samples_transmission','volume indirect':'samples_volume',volume:'samples_volume',sss:'samples_sss',bssrdf:'samples_sss'}; return m[l.toLowerCase()]||null; }
  for(const [re,k] of GMAP) if(re.test(l)) return k;
  return null;
}
/* self-time categories: what Arnold means by each profiling label */
const CAT_EXPLAIN=[
  [/\(shader\)|OSL|shading/i,'Time spent running this shader type across all threads. Big values point at heavy materials: layered standard_surface, SSS, transmission, complex OSL networks.'],
  [/\(light\)/i,'Time spent sampling this light type: shadow rays, importance sampling and light filters. Skydome and big area lights usually lead.'],
  [/BVH|traversal|intersect/i,'Time spent walking the acceleration structure to find what each ray hits. Grows with ray count and scene complexity.'],
  [/thread blocked/i,'Threads waiting on locks instead of working. High values usually mean texture loading stalls or a single-threaded step.'],
  [/subdiv/i,'Subdividing meshes during node init.'],[/displace/i,'Running displacement shaders during node init.'],
  [/procedural|usd|alembic/i,'Expanding procedurals (USD, Alembic, stand-ins) into Arnold nodes.'],[/driver/i,'Writing output files.'],
  [/plugin/i,'Loading shader and procedural libraries.'],[/texture|image/i,'Texture lookups and file I/O.'],
];
/* Known warning / error messages → meaning and fix */
const WARN_EXPLAIN=[
  {re:/not tiled|not mipmapped|unmipped|untiled/i,t:'Texture is not tiled/mipmapped',d:'Arnold has to read this texture in full instead of streaming small tiles at the right resolution. It costs memory, I/O time and can block other threads.',f:'Convert it with maketx or turn on auto-generate TX, then point the shader at the .tx file.',src:'tx'},
  {re:/unknown (parameter|node|type)|unsupported type|not supported|ignoring/i,t:'Unknown or unsupported parameter',d:'The scene sets a parameter or attribute Arnold (or this plugin version) does not understand, so it is ignored. The look may differ from what the artist set.',f:'Usually a version mismatch between the DCC plugin and Arnold, or a custom attribute on a USD prim. Check the plugin versions in the System tab, and rename or remove the attribute.',src:null},
  {re:/padding is .*smaller|exceeded bounds?|outside (its )?bound/i,t:'Displacement padding too small',d:'The mesh was displaced further than its bounding box allows, so parts of it can be clipped (holes, cut-off displacement).',f:'Set disp_padding (Bounds Padding) on the object to at least the value Arnold recommends in the message.',src:'disp'},
  {re:/deprecated/i,t:'Deprecated parameter',d:'The parameter still works in this Arnold version but is scheduled for removal; the next upgrade can break the look silently.',f:'Update the scene/template to the replacement parameter named in the message.',src:null},
  {re:/no uv coordinate|uv set/i,t:'Missing UV coordinates',d:'A shader asked for a UV set the mesh does not have (or has holes in). Textures using that UV set render with default UVs on those polygons.',f:'Check the UV set name in the texture node, or fix the mesh UVs.',src:'uv'},
  {re:/chromaticities/i,t:'Colour space not identified',d:'Arnold could not work out the chromaticities of the rendering colour space from the OCIO config and assumed sRGB. Physical sky/blackbody and some conversions may be off.',f:'Make sure the OCIO config defines the scene_linear role and the working space properly.',src:'chroma'},
  {re:/rays per pixel|reduce your sampling/i,t:'Arnold performance warning: too many rays',d:'Arnold itself thinks the sampling is excessive for this frame.',f:'Lower Camera AA or the per-type samples; see Rays & Shading for which ray type dominates.',src:'aa'},

function niceStep(range,n=4){ const raw=range/n; const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function lineChart(series,o={}){

function headerStrip(L){

  else if(L.kind!=='log') st=`<span class="status mid">● ${L.kind==='profile'?'profile JSON':'stats JSON'}</span>`;
  else if(I.renderDone||L.time['frame time']) st=`<span class="status ok">● render complete</span>`;

  return `<div class="strip"><div class="fn">${esc(L.name)}</div>${st}<div class="meta">${I.host?`<span>host <b>${esc(I.host)}</b></span>`:''}${I.version?`<span>Arnold <b>${esc(I.version)}</b></span>`:''}${I.dcc?`<span><b>${esc(I.dcc)}</b> ${esc(I.host_app||'')}</span>`:''}${I.started?`<span>${esc(I.started)}</span>`:''}</div></div>`;

/* camera (AA) samples: fixed vs adaptive, and what the render actually used */
function camInfo(L){
  const I=L.info; if(I.aa==null) return null;
  if(I.aa<=0) return {progressive:true,aa:I.aa,adaptive:false,min:1,max:1,actual:L.rays?.rows.find(r=>r.name==='camera')?.perPixel??null,pos:null};
  const adaptive=I.adaptive===true||(I.adaptive!==false&&I.aaMax!=null&&I.aaMax>I.aa);
  const min=I.aa*I.aa, max=adaptive&&I.aaMax?I.aaMax*I.aaMax:min;
  const cam=L.rays?.rows.find(r=>r.name==='camera'); const actual=cam?.perPixel??null;
  const pos=adaptive&&actual!=null&&max>min?Math.max(0,Math.min(1,(actual-min)/(max-min))):null;

function camBlock(L,compact){

    <div class="cmh"><span class="yn ${c.adaptive?'y':'na'}">${c.adaptive?'Adaptive on':'Adaptive off · fixed'}</span></div>

      ?big(`${c.aa} → ${c.aaMax}`,'camera AA min → max','adaptive',`AA_samples ${c.aa}, AA_samples_max ${c.aaMax}`)+big(`${fmtInt(c.min)} – ${fmtInt(c.max)}`,'samples per pixel','adaptive','AA² to AA_max² camera samples per pixel')+big(c.thr??'—','threshold','adaptive','adaptive_threshold')+big(c.actual!=null?fmtNum(c.actual,1):'—','average used per pixel','ray_camera','camera rays per pixel from the ray counts')

function guideSteps(L){

     d:'Start at the bottom of the log. A healthy render ends with "render done", the stats blocks and "Arnold shutdown". If the log just stops, the process was killed (farm timeout, out of memory) or crashed. Read the last 30 lines and every ERROR first; a missing texture or licence problem explains a "wrong" frame faster than any statistic.'},

function aovAudit(L){
  const I=L.info, px=(I.w||0)*(I.h||0), outByName=Object.fromEntries(I.outputs.map(o=>[o.name,o]));
  const seen={}; I.aovs.forEach(a=>{ const k=a.name+'|'+a.driver; seen[k]=(seen[k]||0)+1; });
  const aovWarn=name=>[...L.warnings,...L.errors].filter(o=>/\baovs?\b/i.test(o.msg)&&new RegExp(`["'\`\\s]${name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}["'\`\\s,:]`).test(' '+o.msg+' '));
  const rows=I.aovs.map((a,i)=>{
    const out=outByName[a.driver], drvType=out?.type||'', ch=AOV_CH[a.type?.toUpperCase()]||3;
    const mb=px?px*ch*4/1048576:null;
    const flags=[]; const isData=DATA_AOV.test(a.name), filt=(a.filter||'').split('/').pop();
    if(seen[a.name+'|'+a.driver]>1) flags.push({sev:'red',t:'DUPLICATE',d:`"${a.name}" is sent to the driver "${a.driver}" more than once. It is rendered and written twice; remove the extra entry from the ROP.`});
    const w=aovWarn(a.name); if(w.length) flags.push({sev:'red',t:L.errors.some(e=>w.includes(e))?'LOG ERROR':'LOG WARNING',d:`Arnold reported: ${w[0].msg.trim()}${w.length>1?` (+${w.length-1} more)`:''}`,line:w[0].n});

  });

  rows.forEach(r=>{ if(r.mb&&tot&&r.mb/tot>0.18&&rows.length>4) r.flags.push({sev:'amber',t:'HEAVY',d:`About ${fmtMB(r.mb)} of full-frame ${r.type} buffer (${fmtPct(r.mb/tot*100,0)} of all AOV buffers). Consider half precision if the pass allows it.`}); });

}

  {re:/shader|network|osl/i,use:'yes',t:'Shading',what:'Shader or OSL statistics.',look:'Expensive or very numerous shader networks.'},
  {re:/texture|image|oiio/i,use:'yes',t:'Textures',what:'Texture statistics.',look:'See the Textures tab.'},
  {re:/memory|\bmem\b/i,use:'yes',t:'Memory',what:'A memory breakdown.',look:'See the Memory tab for the same numbers as a tree.'},
  {re:/gpu|optix|cuda|device/i,use:'some',t:'GPU',what:'GPU device or OptiX information.',look:'Device memory limits and driver versions when GPU renders fail.'},
  {re:/denois|noice|oidn/i,use:'some',t:'Denoiser',what:'Denoiser settings and timing.',look:'Denoise time on the farm compared with render time.'},
  {re:/bucket|tile/i,use:'some',t:'Buckets',what:'Bucket or tile statistics.',look:'Very uneven bucket times: smaller buckets balance the end of the frame better.'},
  {re:/plugin|unload|closing|licen|shutdown/i,use:'no',t:'Housekeeping',what:'Start-up or shutdown messages (plugins, licences).',look:'Only useful when a plugin or licence fails.'},
];
function sectionInfo(title){ return SECTION_EXPLAIN.find(s=>s.re.test(title))||{use:'some',t:'Other Arnold statistics',what:'A statistics block this inspector does not chart yet. The rows below are shown as Arnold printed them.',look:'If this block matters for your work, send me a sample and I can turn it into a chart.'}; }
const USE_LBL={yes:['Useful for optimisation','y'],some:['Sometimes useful','na'],no:['Not for optimisation','n']};
function sectionHead(title){ const s=sectionInfo(title), [l,c]=USE_LBL[s.use]; return `<div class="secx"><div class="secxh"><span class="yn ${c}">${l}</span><b>${esc(s.t)}</b></div><p><b>What it is:</b> ${esc(s.what)}</p><p><b>What to look for:</b> ${esc(s.look)}</p></div>`; }
function rawSectionView(sec){
  const rows=sec.lines.slice(1).map(l=>({ind:(l.match(/^\s*/)[0]||'').length,parts:l.trim().split(/\s{2,}|\t+/)})).filter(r=>r.parts[0]);
  const tabular=rows.length&&rows.filter(r=>r.parts.length>=2).length>=rows.length*0.6;
  const body=tabular?`<div class="tw"><table class="tbl"><tbody>${rows.map(r=>`<tr><td style="padding-left:${10+Math.max(0,r.ind-1)*6}px">${esc(r.parts[0])}</td>${r.parts.slice(1).map(p=>`<td class="n mono">${esc(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<pre class="raw">${esc(sec.lines.slice(1).join('\n'))}</pre>`;
  return sectionHead(sec.title)+body+`<details><summary>Raw text</summary><pre class="raw">${esc(sec.lines.join('\n'))}</pre></details>`;
}
/* ---------- shell ---------- */
function renderFiles(){
  const el=document.getElementById('files');
  el.innerHTML=state.logs.map((L,i)=>`<span class="chipf ${i===state.active?'on':''}" data-i="${i}" role="button" tabindex="0">${state.logs.length>1?ldot(i):''}<span class="nm" title="${esc(L.name)}">${esc(L.name)}</span>${L.sample?'<span class="sample-tag">sample</span>':''}<small>${fmtDur(L.frameTime)}</small><button class="x" type="button" data-x="${i}" aria-label="Remove ${esc(L.name)}">×</button></span>`).join('');
  if(state.logs.length>1) el.insertAdjacentHTML('beforeend',`<span class="fhint" title="Scroll the mouse wheel over this row, or press [ and ], to switch logs">${state.active+1} / ${state.logs.length} · scroll here or press [ ] to switch</span>`);
  el.hidden=!state.logs.length;
  document.getElementById('clearAll').hidden=!state.logs.length;
}
function renderTabs(){
  const L=cur(); const cnt={warnings:L?(L.errors.length?`<span class="cnt e">${L.errors.length}</span>`:L.warnings.length?`<span class="cnt w">${L.warnings.length}</span>`:''):'',sequence:state.logs.length>1?`<span class="cnt">${state.logs.length}</span>`:'',aovs:L&&L.info.aovs.length?(()=>{ const A=aovAudit(L); const r=new Set(A.rows.filter(x=>x.flags.some(f=>f.sev==='red')).map(x=>x.name)).size; return r?`<span class="cnt e">${r}</span>`:`<span class="cnt">${A.rows.length}</span>`; })():'',textures:L&&L.texIssues&&L.texIssues.length?`<span class="cnt ${L.texIssues.some(e=>e.reasons.includes('MISSING / BROKEN'))?'e':'w'}">${L.texIssues.length}</span>`:'',log:L?`<span class="cnt">${fmtInt(L.lines.length)}</span>`:''};
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${state.tab===k?'on':''}" role="tab" aria-selected="${state.tab===k}" data-tab="${k}" type="button" ${!L&&k!=='guide'?'disabled':''}>${l}${cnt[k]||''}</button>`).join('');
}
function render(){
  TB={}; tbN=0;
  renderFiles(); renderTabs();
  const L=cur(), v=document.getElementById('view');
  if(!L&&state.tab==='guide'){ v.innerHTML=vGuide(null); bindGuide(); hideTip(true); return; }
  if(!L){ v.innerHTML=`<section class="start" id="startZone">
      <div class="st-in">
        <h2>Drop an Arnold log here</h2>
        <p class="muted">Render logs from kick, HtoA, MtoA or the farm, Arnold stats <code>.json</code> or profile <code>.json</code>. Everything stays in your browser.</p>
        <div class="st-act"><label class="btn primary" for="fileIn">Open logs…</label><button class="btn" type="button" id="startPaste">Paste log</button></div>
        <ul class="st-ways"><li><b>Drag & drop</b> one or more files anywhere on the page</li><li><b>Ctrl+V</b> anywhere to paste a log you copied</li><li>Several logs at once open the <b>Compare</b> tab</li></ul>
        <button class="lnk" type="button" data-gotab="guide">Read the debug guide first →</button>
      </div></section>`; hideTip(true); return; }
  const fn={overview:vOverview,time:vTime,memory:vMemory,rays:vRays,textures:vTextures,geometry:vGeometry,warnings:vWarnings,system:vSystem,log:vLog,sequence:vSequence,guide:vGuide,aovs:vAovs}[state.tab]||vOverview;
  try{ v.innerHTML=fn(L); }catch(e){ console.error(e); v.innerHTML=`<section class="panel"><h2>Couldn't draw this view</h2><p class="muted">${esc(e.message)}. The other tabs may still work; the raw lines are in the Log tab.</p></section>`; }
  if(state.tab==='log') bindLog();
  if(state.tab==='guide') bindGuide();
  v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in'); countUp(v);
  hideTip(true);
}
function bindLog(){
  fillLog();
  let tmr; document.getElementById('lq').addEventListener('input',e=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ state.lf.q=e.target.value; fillLog(); },160); });
  document.getElementById('llvl').addEventListener('change',e=>{ state.lf.lvl=e.target.value; fillLog(); });
  document.getElementById('ltag').addEventListener('change',e=>{ state.lf.tag=e.target.value; fillLog(); });
  document.getElementById('lstat').addEventListener('change',e=>{ state.lf.stats=e.target.checked; fillLog(); });
}
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; state.tab=b.dataset.tab; try{ localStorage.setItem('ali.tab',state.tab); }catch(x){} render(); window.scrollTo({top:0}); });
document.getElementById('files').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]'); if(x){ e.stopPropagation(); state.logs.splice(+x.dataset.x,1); state.active=Math.min(state.active,state.logs.length-1); render(); return; }
  const c=e.target.closest('[data-i]'); if(c){ state.active=+c.dataset.i; render(); }
});
/* mouse wheel over the log row switches the active log; [ and ] do the same from the keyboard */
function stepLog(d){
  const n=state.logs.length; if(n<2) return;
  state.active=(state.active+d+n)%n; render();
  const chip=document.querySelector(`.chipf[data-i="${state.active}"]`); chip?.scrollIntoView({block:'nearest',inline:'nearest'});
  chip?.classList.add('flip'); setTimeout(()=>chip?.classList.remove('flip'),260);
}
let wheelAcc=0,wheelT=0;
document.getElementById('files').addEventListener('wheel',e=>{
  if(state.logs.length<2) return;
  e.preventDefault();
  const dy=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  wheelAcc+=e.deltaMode===1?dy*40:dy;            // lines → pixels
  const now=performance.now();
  if(Math.abs(wheelAcc)>=60&&now-wheelT>90){ stepLog(wheelAcc>0?1:-1); wheelAcc=0; wheelT=now; }
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
  if(e.key===']'){ e.preventDefault(); stepLog(1); } else if(e.key==='['){ e.preventDefault(); stepLog(-1); }
});
document.getElementById('files').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset.i!=null){ e.preventDefault(); state.active=+e.target.dataset.i; render(); } });
document.getElementById('view').addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]'); if(!j) return;
  state.tab='log'; state.lf={q:'',lvl:'all',tag:'all',stats:true}; render();
  const row=document.getElementById('ln'+j.dataset.jump); if(row){ row.scrollIntoView({block:'center'}); row.style.outline='2px solid var(--accent)'; }
});
let pasteN=0;
// mode: 'replace' swaps out every loaded log, 'add' keeps them (Compare)
function addTexts(items,mode='add'){
  const loaded=[],errs=[];
  for(const {name,text} of items){
    try{ loaded.push(parseAny(text,name)); }
    catch(e){ console.error(e); errs.push(`${name}: ${e.message}`); }
  }
  if(loaded.length){
    if(mode==='replace') state.logs=[];
    state.logs=state.logs.filter(x=>!x.sample);
    for(const L of loaded){ const j=state.logs.findIndex(x=>x.name===L.name); if(j>=0) state.logs[j]=L; else state.logs.push(L); }
    state.logs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    state.active=state.logs.indexOf(loaded[loaded.length-1]);
    state.lf={q:'',lvl:'all',tag:'all',stats:true};
    if(state.tab==='sequence'&&state.logs.length<2) state.tab='overview';
    render(); window.scrollTo({top:0});
  }
  if(errs.length) toast(`Couldn't read ${errs.join('; ')}`);
  else if(loaded.length&&items.length>1) toast(loaded.length>1?`Loaded ${loaded.length} logs.`:`Loaded ${loaded[0].name}${loaded[0].unrecognized?' (no Arnold lines recognised)':''}.`);
  return {loaded,errs};
}
async function addFiles(files){ const items=[]; for(const f of files){ try{ items.push({name:f.name,text:await f.text()}); }catch(e){ toast(`Couldn't open ${f.name}.`); } } addTexts(items,'add'); }
function pastedName(text){
  // name pasted logs after the frame / scene they render, falling back to a counter
  pasteN++;
  const w=text.match(/writing file `([^']+)'/)||text.match(/registered driver: "[^"]+" \(\w+\) -> (\S+)/);
  if(w) return w[1].split(/[\\/]/).pop().replace(/\.(exr|tif{1,2}|png|jpe?g|deepexr)$/i,'')+'.log';
  const sc=text.match(/reading scene from (\S+)/)||text.match(/\[ass\] loading (\S+)/);
  if(sc) return sc[1].split(/[\\/]/).pop().replace(/\.\w+$/,'')+'.log';
  return `pasted-log-${pasteN}.log`;
}
document.getElementById('fileIn').addEventListener('change',e=>{ addFiles([...e.target.files]); e.target.value=''; });
const pp=document.getElementById('pastePanel'), ta=document.getElementById('pasteTa'), pmsg=document.getElementById('pasteMsg');
const setMsg=(t,c='')=>{ pmsg.textContent=t; pmsg.className='pmsg '+c; };
document.addEventListener('click',e=>{ if(e.target.closest('#startPaste')) openPaste(); });
document.getElementById('clearAll').addEventListener('click',()=>{ state.logs=[]; state.active=0; state.cmp.base=0; state.tf={kind:'all',fmt:'paths'}; pp.hidden=true; ta.value=''; if(state.tab!=='guide') state.tab='overview'; render(); window.scrollTo({top:0}); toast('Cleared. Paste or drop a log to start again.'); });
function openPaste(){ pp.hidden=false; setMsg(''); ta.focus(); ta.select(); window.scrollTo({top:0}); }
document.getElementById('pasteBtn').addEventListener('click',()=>{ if(pp.hidden) openPaste(); else pp.hidden=true; });
document.getElementById('pasteCancel').addEventListener('click',()=>{ pp.hidden=true; });
document.getElementById('pasteClear').addEventListener('click',()=>{ ta.value=''; setMsg(''); ta.focus(); });
const keepEl=document.getElementById('pasteKeep');
try{ const k=localStorage.getItem('ali.keep'); if(k!=null) keepEl.checked=k==='1'; }catch(e){}
keepEl.addEventListener('change',()=>{ try{ localStorage.setItem('ali.keep',keepEl.checked?'1':'0'); }catch(e){} });
function analyzePasted(text,keep){
  if(!text.trim()){ setMsg('Paste a log into the box first.','err'); return false; }
  const name=pastedName(text);
  setMsg('Reading…');
  const r=addTexts([{name,text}],keep?'add':'replace');
  if(r.errs.length){ setMsg(`Couldn't read this log: ${r.errs[0].split(': ').slice(1).join(': ')}`,'err'); return false; }
  const L=r.loaded[0];
  if(L.unrecognized||!L.timedCount){ setMsg(`Loaded ${fmtInt(L.lines.length)} lines as ${name} · ${fmtInt(L.timedCount||0)} with Arnold timestamps`+(L.unrecognized?' · format not recognised':''),'err'); return true; }
  // success: close the paste box and empty it, ready for the next paste
  pp.hidden=true; ta.value=''; setMsg('');
  toast(`Loaded ${name} · ${fmtInt(L.lines.length)} lines${keep&&state.logs.length>1?` · ${state.logs.length} logs open`:''}`);
  return true;
}
document.getElementById('pasteGo').addEventListener('click',()=>{ analyzePasted(ta.value,document.getElementById('pasteKeep').checked); });
ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); analyzePasted(ta.value,document.getElementById('pasteKeep').checked); } });
// Ctrl+V anywhere on the page (outside a text field) loads the clipboard straight away
document.addEventListener('paste',e=>{
  const t=e.target; if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable)) return;
  const text=e.clipboardData?.getData('text'); if(!text||!text.trim()) return;
  e.preventDefault(); ta.value=text;
  analyzePasted(text,document.getElementById('pasteKeep').checked);
  if(ta.value) pp.hidden=false;
});
const drop=document.getElementById('drop'); let dc=0;
window.addEventListener('dragenter',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')){ dc++; drop.hidden=false; } });
window.addEventListener('dragleave',()=>{ dc=Math.max(0,dc-1); if(!dc) drop.hidden=true; });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dc=0; drop.hidden=true; if(e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); });

buildMenus(); setSkin(SKIN); setFont(FONT);
render();
</script>
